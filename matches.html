<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#050505" />
<title>対戦記録｜ビリヤード配置図メーカー</title>
<style>
:root{--green:#07543d;--green2:#0b6b4f;--deep:#03261c;--cream:#f7f5ee;--card:#fff;--line:#e7e2d7;--muted:#74817b;--ink:#17251f;--brown:#5d3822;--brown2:#8a5a34;--win:#d9f5e7;--lose:#ffe0e0;--shadow:0 18px 42px rgba(0,0,0,.35)}
*{box-sizing:border-box}html{background:#050505}body{margin:0;min-height:100dvh;color:white;font-family:system-ui,-apple-system,"Noto Sans JP","Yu Gothic",sans-serif;background:radial-gradient(circle at 70% 0,rgba(12,120,82,.42),transparent 34rem),linear-gradient(180deg,#050505,#081611 45%,#050505)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{width:min(980px,calc(100% - 18px));margin:auto;padding:18px 0 36px}.top{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;margin-bottom:14px}.top h1{font-size:clamp(30px,6vw,54px);margin:0;line-height:1.08}.top p{margin:8px 0 0;color:rgba(255,255,255,.72);line-height:1.8;font-size:14px}.top-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.top a,.ghost-btn{border:1px solid rgba(255,255,255,.26);background:rgba(255,255,255,.1);color:#fff;text-decoration:none;border-radius:999px;padding:11px 15px;font-weight:900}.score-panel{background:var(--cream);border:1px solid rgba(255,255,255,.32);border-radius:30px;overflow:hidden;box-shadow:var(--shadow);color:var(--ink);margin-bottom:16px}.score-toolbar{display:flex;gap:10px;justify-content:center;align-items:center;background:linear-gradient(135deg,var(--green),var(--green2));padding:16px;border-bottom:1px solid rgba(255,255,255,.18)}.record-toggle{border:0;border-radius:999px;padding:15px 24px;font-size:18px;font-weight:950;background:#fff;color:var(--green);box-shadow:inset 0 -2px 0 rgba(0,0,0,.08)}.record-toggle.off{color:#222;background:#efefef}.record-toggle.danger{background:#fff;color:#333}.score-main{background:radial-gradient(circle at 50% 20%,rgba(20,158,108,.3),transparent 28rem),linear-gradient(145deg,#043a2b,#07533d 60%,#043428);color:#fff;padding:18px clamp(18px,4vw,34px) 28px}.match-time{display:flex;justify-content:center;align-items:center;gap:14px;margin-bottom:24px}.match-time.hidden .time-value{display:none}.time-value{font-size:clamp(34px,8vw,66px);font-weight:950;letter-spacing:.05em;font-variant-numeric:tabular-nums}.time-btn{border:0;border-radius:999px;background:rgba(255,255,255,.18);color:#fff;padding:13px 16px;font-size:17px;font-weight:950;min-width:76px}.scoreboard{display:grid;grid-template-columns:minmax(0,1fr) clamp(70px,12vw,126px) minmax(0,1fr);align-items:end;gap:clamp(18px,5vw,60px)}.player-name{width:100%;border:0;border-bottom:4px solid rgba(255,255,255,.26);background:transparent;color:#fff;text-align:center;font-size:clamp(30px,6vw,56px);font-weight:950;outline:0;padding:0 4px 12px}.score-num{font-size:clamp(96px,23vw,210px);line-height:.9;font-weight:1000;text-align:center;letter-spacing:.035em;font-variant-numeric:tabular-nums;text-shadow:0 12px 28px rgba(0,0,0,.22)}.score-dash{align-self:center;text-align:center;font-size:clamp(52px,10vw,110px);font-weight:950;color:rgba(255,255,255,.82);padding-bottom:10px}.point-buttons{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:24px}.point-buttons button{border:0;border-radius:24px;min-height:92px;font-size:clamp(32px,6vw,58px);font-weight:1000;color:#fff;box-shadow:0 12px 22px rgba(0,0,0,.24)}.plus{background:linear-gradient(135deg,#16b879,#0b805b)}.minus{background:#68736e}.clock-panel{margin-top:20px;border-radius:28px;background:linear-gradient(135deg,var(--brown),var(--brown2));padding:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}.clock-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;color:#fff}.clock-head h2{margin:0;font-size:22px}.clock-head span{font-size:13px;color:rgba(255,255,255,.76);font-weight:800}.clock-settings{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.clock-settings label{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.15);border-radius:16px;color:#fff;padding:10px;font-weight:900}.clock-settings select{flex:1;border:0;border-radius:12px;background:#fff;color:#2b1c13;padding:9px;font-weight:900}.clock-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}.clock-card{border:2px solid rgba(255,255,255,.28);background:rgba(0,0,0,.18);border-radius:24px;padding:16px;text-align:center;color:#fff;min-height:154px}.clock-card.active{outline:4px solid rgba(255,255,255,.55);background:rgba(0,0,0,.32)}.clock-label{font-size:clamp(24px,5vw,42px);font-weight:1000;margin-bottom:8px}.clock-time{font-size:clamp(44px,10vw,86px);line-height:1;font-weight:1000;font-variant-numeric:tabular-nums}.clock-stop{width:100%;margin-top:14px;border:0;border-radius:22px;background:#fff;color:#4c2e1c;min-height:68px;font-size:24px;font-weight:1000}.form-panel,.records-panel{background:var(--cream);color:var(--ink);border-radius:28px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:16px}.panel-head{background:linear-gradient(135deg,var(--green),var(--green2));color:white;padding:18px 20px}.panel-head h2{margin:0;font-size:22px}.panel-head span{display:block;color:rgba(255,255,255,.74);font-size:12px;margin-top:4px}.content{padding:14px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.field{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:0 4px 12px rgba(18,36,28,.06)}.field.full{grid-column:1/-1}.label{display:block;color:var(--muted);font-size:11px;font-weight:900;margin-bottom:5px}input,select,textarea{width:100%;border:0;outline:0;background:transparent;color:var(--ink);font-weight:800}select{appearance:auto}textarea{min-height:90px;resize:vertical;line-height:1.6;font-weight:600}.two-input{display:grid;grid-template-columns:1fr 1fr;gap:8px}.layout-box{margin-top:12px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px}.layout-title{font-size:30px;font-weight:1000;margin:0 0 8px}.layout-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.btn{border:1px solid var(--line);border-radius:16px;background:#fff;color:var(--green);padding:13px 14px;font-weight:950}.primary{width:100%;margin-top:12px;background:linear-gradient(135deg,var(--green),var(--green2));color:white;border:0;padding:17px;font-size:18px}.list{background:white;border:1px solid var(--line);border-radius:18px;overflow:hidden}.row{display:grid;grid-template-columns:82px 1fr 52px 58px 64px 66px;gap:8px;align-items:center;padding:11px 12px;border-bottom:1px solid #ece7dd;font-size:13px}.row:last-child{border-bottom:0}.head{background:#fbfaf7;color:var(--muted);font-weight:950}.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-weight:950;text-align:center}.win{background:var(--win);color:#087040}.lose{background:var(--lose);color:#c93a3a}.row button{border:0;background:transparent;color:var(--green);font-weight:950}.empty{padding:22px;text-align:center;color:var(--muted)}.modal{position:fixed;inset:0;background:rgba(0,0,0,.66);display:none;place-items:center;z-index:20;padding:16px}.modal.open{display:grid}.modal-box{width:min(980px,100%);max-height:90dvh;overflow:auto;background:var(--cream);color:var(--ink);border-radius:26px;box-shadow:var(--shadow);padding:16px}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.modal-head h3{margin:0;font-size:24px}.close{border:0;border-radius:50%;width:44px;height:44px;background:#fff;color:var(--green);font-size:22px;font-weight:1000}.layout-list{display:grid;gap:10px}.layout-item{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.layout-item b{font-size:18px}.layout-item small{display:block;color:var(--muted);margin-top:4px}.preview-canvas{width:100%;height:auto;background:#151b20;border-radius:16px;display:block}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(18px);background:#111;color:#fff;border-radius:999px;padding:12px 18px;opacity:0;transition:.22s;z-index:30}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}@media(max-width:740px){.app{width:min(520px,calc(100% - 16px));padding-top:12px}.top{display:block}.top-actions{justify-content:flex-start;margin-top:12px}.score-toolbar{gap:8px;padding:14px 10px}.record-toggle{font-size:18px;padding:14px 17px}.score-main{padding:14px 16px 24px}.match-time{gap:8px;margin-bottom:26px}.time-btn{min-width:66px;padding:12px 10px}.scoreboard{grid-template-columns:minmax(0,1fr) 52px minmax(0,1fr);gap:20px}.score-num{font-size:clamp(96px,27vw,142px)}.score-dash{font-size:58px}.point-buttons{gap:10px}.point-buttons button{min-height:86px;border-radius:22px}.clock-cards{grid-template-columns:1fr 1fr;gap:8px}.clock-card{padding:12px 6px;min-height:136px}.clock-time{font-size:clamp(43px,12vw,58px)}.clock-settings{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.row{grid-template-columns:70px 1fr 42px 48px 48px 52px;font-size:11px;padding-inline:7px}.layout-title{font-size:26px}}
</style>
</head>
<body>
<main class="app">
  <div class="top">
    <div><h1>対戦記録</h1><p>途中で別ページへ移動しても、スコア・時間・入力内容は自動保存されます。</p></div>
    <div class="top-actions"><a href="index.html">← 配置図へ戻る</a></div>
  </div>

  <section class="score-panel">
    <div class="score-toolbar">
      <button id="recordOn" class="record-toggle" type="button">記録する</button>
      <button id="recordOff" class="record-toggle off" type="button">記録しない</button>
      <button id="resetAll" class="record-toggle danger" type="button">リセット</button>
    </div>
    <div class="score-main">
      <div id="matchTimeWrap" class="match-time">
        <div id="matchTime" class="time-value">00:00:00</div>
        <button id="toggleMatchTime" class="time-btn" type="button">非表示</button>
        <button id="startMatchTime" class="time-btn" type="button">開始</button>
        <button id="stopMatchTime" class="time-btn" type="button">停止</button>
      </div>
      <div class="scoreboard">
        <div>
          <input id="leftName" class="player-name" value="自分" />
          <div id="leftScore" class="score-num">00</div>
          <div class="point-buttons"><button class="plus" data-score="left" data-delta="1">+1</button><button class="minus" data-score="left" data-delta="-1">-1</button></div>
        </div>
        <div class="score-dash">-</div>
        <div>
          <input id="rightName" class="player-name" value="相手" />
          <div id="rightScore" class="score-num">00</div>
          <div class="point-buttons"><button class="plus" data-score="right" data-delta="1">+1</button><button class="minus" data-score="right" data-delta="-1">-1</button></div>
        </div>
      </div>

      <section class="clock-panel">
        <div class="clock-head"><h2>チェスクロック</h2><span>左右の枠をタップして開始</span></div>
        <div class="clock-settings">
          <label>左の持ち時間 <select id="leftMinutes"></select></label>
          <label>右の持ち時間 <select id="rightMinutes"></select></label>
        </div>
        <div class="clock-cards">
          <button id="leftClockCard" class="clock-card" type="button"><div class="clock-label">左</div><div id="leftClock" class="clock-time">10:00</div></button>
          <button id="rightClockCard" class="clock-card" type="button"><div class="clock-label">右</div><div id="rightClock" class="clock-time">10:00</div></button>
        </div>
        <button id="stopClock" class="clock-stop" type="button">停止</button>
      </section>
    </div>
  </section>

  <section class="form-panel">
    <div class="panel-head"><h2>記録内容</h2><span>保存する内容だけ下で入力</span></div>
    <div class="content">
      <div class="grid">
        <label class="field"><span class="label">日付</span><input id="date" type="date"></label>
        <div class="field"><span class="label">店舗名</span><div class="two-input"><select id="shopSelect"></select><input id="shop" list="shopList" placeholder="自由入力"></div><datalist id="shopList"></datalist></div>
        <label class="field"><span class="label">対戦相手</span><input id="opponent" placeholder="例：Aさん"></label>
        <div class="field"><span class="label">種目</span><div class="two-input"><select id="gameSelect"><option>9ボール</option><option>10ボール</option><option>エイトボール</option><option>ローテーション</option><option value="custom">自由</option></select><input id="gameCustom" placeholder="自由入力"></div></div>
        <div class="field"><span class="label">形式</span><div class="two-input"><select id="typeSelect"><option>平場</option><option>セットマッチ</option><option>大会</option><option>練習</option><option value="custom">自由</option></select><input id="typeCustom" placeholder="自由入力"></div></div>
        <div class="field"><span class="label">先取</span><div class="two-input"><select id="raceSelect"><option value="3先">3先</option><option value="4先">4先</option><option value="5先">5先</option><option value="7先">7先</option><option value="custom">自由</option></select><input id="raceCustom" placeholder="自由入力"></div></div>
        <label class="field full"><span class="label">メモ</span><textarea id="memo" placeholder="例：9番前の出しが薄くなった。次は厚めに残す。"></textarea></label>
      </div>

      <div class="layout-box">
        <h3 class="layout-title">配置図メーカー</h3>
        <label><span class="label">この試合に紐づける配置図</span><select id="layoutSelect"></select></label>
        <div class="layout-actions"><button id="layoutListBtn" class="btn" type="button">保存した配置図を見る</button><button id="viewLayoutImage" class="btn" type="button">選んだ配置図を画像で見る</button></div>
      </div>
      <button id="saveMatch" class="btn primary" type="button">✓ 対戦記録に保存</button>
    </div>
  </section>

  <section class="records-panel">
    <div class="panel-head"><h2>対戦記録一覧</h2><span>記録内容・チェスクロック・配置図まで一覧で確認</span></div>
    <div class="content"><div class="list"><div class="row head"><span>日付</span><span>店舗</span><span>相手</span><span>得点</span><span>時間</span><span>詳細</span></div><div id="recordRows"></div></div></div>
  </section>
</main>

<div id="layoutModal" class="modal"><div class="modal-box"><div class="modal-head"><h3>保存した配置図</h3><button id="closeLayoutModal" class="close">×</button></div><div id="layoutList" class="layout-list"></div></div></div>
<div id="imageModal" class="modal"><div class="modal-box"><div class="modal-head"><h3 id="imageTitle">配置図</h3><button id="closeImageModal" class="close">×</button></div><canvas id="layoutCanvas" class="preview-canvas" width="960" height="560"></canvas></div></div>
<div id="detailModal" class="modal"><div class="modal-box"><div class="modal-head"><h3>記録詳細</h3><button id="closeDetailModal" class="close">×</button></div><div id="detailBody"></div></div></div>
<div id="toast" class="toast"></div>

<script>
const STORAGE_MATCHES='poolMatchRecords', STORAGE_LAYOUTS='poolNotes', STORAGE_DRAFT='poolMatchDraftV5';
const BALL_COLORS=['#f3d400','#1767c8','#e6382e','#6b3ba9','#ef7d15','#248046','#7b201d','#111','#f0d63b','#1767c8','#e6382e','#6b3ba9','#ef7d15','#248046','#7b201d'];
let left=0,right=0,record=true,matchMs=0,matchTimer=null,matchTimeVisible=true,clockSide=null,clockTimer=null,leftClock=600,rightClock=600,layouts=[],records=[];
const $=id=>document.getElementById(id);
function pad(n){return String(n).padStart(2,'0')}function fmtHMS(ms){const s=Math.floor(ms/1000);return `${pad(Math.floor(s/3600))}:${pad(Math.floor(s%3600/60))}:${pad(s%60)}`}function fmtMS(sec){return `${pad(Math.floor(sec/60))}:${pad(sec%60)}`}
function today(){const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}function readJSON(k,f){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(f))}catch{return f}}function writeJSON(k,v){localStorage.setItem(k,JSON.stringify(v))}
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1600)}
function scoreText(){return `${pad(left)} - ${pad(right)}`}function updateScore(){ $('leftScore').textContent=pad(left); $('rightScore').textContent=pad(right); saveDraft(); }
function updateMatchTime(){ $('matchTime').textContent=fmtHMS(matchMs); saveDraft(); }
function startMatchTimer(){if(matchTimer)return;let last=Date.now();matchTimer=setInterval(()=>{const now=Date.now();matchMs+=now-last;last=now;updateMatchTime()},250)}function stopMatchTimer(){clearInterval(matchTimer);matchTimer=null;updateMatchTime()}
function fillMinuteSelects(){[$('leftMinutes'),$('rightMinutes')].forEach(sel=>{sel.innerHTML='';for(let m=10;m<=120;m+=5){const op=document.createElement('option');op.value=m;op.textContent=`${m}分`;sel.append(op)}});$('leftMinutes').value='10';$('rightMinutes').value='10'}
function setClockFromSelect(){leftClock=Number($('leftMinutes').value)*60;rightClock=Number($('rightMinutes').value)*60;updateClock();saveDraft()}function startClock(side){clockSide=side;document.querySelectorAll('.clock-card').forEach(c=>c.classList.remove('active'));$(side+'ClockCard').classList.add('active');if(!clockTimer){clockTimer=setInterval(()=>{if(!clockSide)return;if(clockSide==='left')leftClock=Math.max(0,leftClock-1);else rightClock=Math.max(0,rightClock-1);updateClock();saveDraft()},1000)}saveDraft()}function stopClock(){clockSide=null;clearInterval(clockTimer);clockTimer=null;document.querySelectorAll('.clock-card').forEach(c=>c.classList.remove('active'));saveDraft()}function updateClock(){ $('leftClock').textContent=fmtMS(leftClock); $('rightClock').textContent=fmtMS(rightClock); }
function getVal(selectId,inputId){const sel=$(selectId),inp=$(inputId);return sel.value==='custom'?(inp.value.trim()||'自由'):sel.value}
function setRecord(v){record=v;$('recordOn').classList.toggle('off',!v);$('recordOff').classList.toggle('off',v);saveDraft()}
function loadLayouts(){layouts=readJSON(STORAGE_LAYOUTS,[]);const sel=$('layoutSelect');sel.innerHTML='<option value="">配置図なし</option>'+layouts.map(x=>`<option value="${x.id}">${escapeHtml(x.title||'名称なし')}｜${escapeHtml(formatDate(x.updatedAt||x.createdAt||x.date))}</option>`).join('')}
function formatDate(v){if(!v)return'';const d=new Date(v);return Number.isNaN(d.getTime())?String(v):d.toLocaleString('ja-JP',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}
function selectedLayout(){return layouts.find(x=>String(x.id)===$('layoutSelect').value)}
function escapeHtml(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function shops(){const base=['快活百合ヶ丘','BAGUS新宿','セスパ','ジーク','NORA','パラダイスたまプラ','ロサ','BILLIARDS K'];const past=records.map(r=>r.shop).filter(Boolean);return [...new Set([...past,...base])]}function renderShopOptions(){const opts=shops();$('shopSelect').innerHTML='<option value="">店舗を選択</option>'+opts.map(s=>`<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('');$('shopList').innerHTML=opts.map(s=>`<option value="${escapeHtml(s)}"></option>`).join('')}
function saveDraft(){const data={left,right,record,matchMs,matchTimeVisible,clockSide,leftClock,rightClock,date:$('date').value,shop:$('shop').value,opponent:$('opponent').value,leftName:$('leftName').value,rightName:$('rightName').value,gameSelect:$('gameSelect').value,gameCustom:$('gameCustom').value,typeSelect:$('typeSelect').value,typeCustom:$('typeCustom').value,raceSelect:$('raceSelect').value,raceCustom:$('raceCustom').value,leftMinutes:$('leftMinutes').value,rightMinutes:$('rightMinutes').value,memo:$('memo').value,layoutId:$('layoutSelect').value};writeJSON(STORAGE_DRAFT,data)}
function loadDraft(){const d=readJSON(STORAGE_DRAFT,null);$('date').value=today();if(!d)return;left=d.left||0;right=d.right||0;record=d.record!==false;matchMs=d.matchMs||0;matchTimeVisible=d.matchTimeVisible!==false;leftClock=d.leftClock??600;rightClock=d.rightClock??600;['date','shop','opponent','leftName','rightName','gameSelect','gameCustom','typeSelect','typeCustom','raceSelect','raceCustom','leftMinutes','rightMinutes','memo'].forEach(id=>{if(d[id]!==undefined&&$(id))$(id).value=d[id]});if(d.layoutId)$('layoutSelect').value=d.layoutId;updateScore();updateMatchTime();updateClock();setRecord(record);$('matchTimeWrap').classList.toggle('hidden',!matchTimeVisible);$('toggleMatchTime').textContent=matchTimeVisible?'非表示':'表示';if(d.clockSide)startClock(d.clockSide)}
function resetAll(){stopMatchTimer();stopClock();left=0;right=0;matchMs=0;setClockFromSelect();['shop','opponent','memo','gameCustom','typeCustom','raceCustom'].forEach(id=>$(id).value='');$('leftName').value='自分';$('rightName').value='相手';$('date').value=today();$('layoutSelect').value='';updateScore();updateMatchTime();saveDraft();toast('リセットしました')}
function saveRecord(){if(!record){toast('記録しない設定です');return}const layout=selectedLayout();const rec={id:Date.now(),date:$('date').value,shop:$('shop').value,opponent:$('opponent').value,leftName:$('leftName').value,rightName:$('rightName').value,score:scoreText(),result:left>right?'勝ち':left<right?'負け':'引き分け',game:getVal('gameSelect','gameCustom'),type:getVal('typeSelect','typeCustom'),race:getVal('raceSelect','raceCustom'),matchTime:fmtHMS(matchMs),leftClockSetting:$('leftMinutes').value+'分',rightClockSetting:$('rightMinutes').value+'分',leftClockRemain:fmtMS(leftClock),rightClockRemain:fmtMS(rightClock),memo:$('memo').value,layoutId:layout?.id||'',layoutTitle:layout?.title||'配置図なし',createdAt:new Date().toISOString()};records.unshift(rec);writeJSON(STORAGE_MATCHES,records.slice(0,300));renderShopOptions();renderRecords();toast('対戦記録に保存しました')}
function renderRecords(){records=readJSON(STORAGE_MATCHES,[]);const box=$('recordRows');if(!records.length){box.innerHTML='<div class="empty">対戦記録はまだありません。</div>';return}box.innerHTML=records.map(r=>`<div class="row"><span>${escapeHtml(r.date||'')}</span><span>${escapeHtml(r.shop||'')}</span><span>${escapeHtml(r.opponent||'')}</span><span>${escapeHtml(r.score||'')}</span><span>${escapeHtml(r.matchTime||'')}</span><button data-id="${r.id}">開く</button></div>`).join('');box.querySelectorAll('button').forEach(b=>b.onclick=()=>showDetail(b.dataset.id))}
function showDetail(id){const r=records.find(x=>String(x.id)===String(id));if(!r)return;$('detailBody').innerHTML=`<div class="grid"><div class="field"><span class="label">日付</span>${escapeHtml(r.date)}</div><div class="field"><span class="label">店舗</span>${escapeHtml(r.shop)}</div><div class="field"><span class="label">相手</span>${escapeHtml(r.opponent)}</div><div class="field"><span class="label">種目</span>${escapeHtml(r.game)}</div><div class="field"><span class="label">形式</span>${escapeHtml(r.type)}</div><div class="field"><span class="label">先取</span>${escapeHtml(r.race)}</div><div class="field"><span class="label">スコア</span>${escapeHtml(r.score)}</div><div class="field"><span class="label">試合時間</span>${escapeHtml(r.matchTime)}</div><div class="field"><span class="label">左チェスクロック</span>${escapeHtml(r.leftClockSetting)} / 残り ${escapeHtml(r.leftClockRemain)}</div><div class="field"><span class="label">右チェスクロック</span>${escapeHtml(r.rightClockSetting)} / 残り ${escapeHtml(r.rightClockRemain)}</div><div class="field full"><span class="label">配置図メーカー</span>${escapeHtml(r.layoutTitle)}</div><div class="field full"><span class="label">メモ</span>${escapeHtml(r.memo||'')}</div></div>`;$('detailModal').classList.add('open')}
function renderLayoutList(){const box=$('layoutList');loadLayouts();if(!layouts.length){box.innerHTML='<div class="empty">保存した配置図はまだありません。</div>';return}box.innerHTML=layouts.map(x=>`<div class="layout-item"><div><b>${escapeHtml(x.title||'名称なし')}</b><small>${escapeHtml(formatDate(x.updatedAt||x.createdAt||x.date))}</small></div><div><button class="btn" data-use="${x.id}">選ぶ</button> <button class="btn" data-view="${x.id}">画像</button></div></div>`).join('');box.querySelectorAll('[data-use]').forEach(b=>b.onclick=()=>{$('layoutSelect').value=b.dataset.use;saveDraft();$('layoutModal').classList.remove('open');toast('配置図を選びました')});box.querySelectorAll('[data-view]').forEach(b=>{b.onclick=()=>{const item=layouts.find(x=>String(x.id)===b.dataset.view);showLayoutImage(item)}})}
function showLayoutImage(item=selectedLayout()){if(!item){toast('配置図を選んでください');return}$('imageTitle').textContent=item.title||'配置図メーカー';drawLayout(item);$('imageModal').classList.add('open')}
function ballKind(n){const id=String(n);return id==='cue'||id.startsWith('cue-')?'cue':id==='ghost'||id.startsWith('ghost-')?'ghost':id}
function drawLayout(item){const c=$('layoutCanvas'),ctx=c.getContext('2d'),land=item.orientation==='landscape',W=land?960:560,H=land?560:960;c.width=W;c.height=H;ctx.clearRect(0,0,W,H);ctx.fillStyle='#151b20';ctx.fillRect(0,0,W,H);const margin=38,side=70,tx=margin,ty=margin,tw=W-margin*2-side,th=H-margin*2;round(ctx,tx,ty,tw,th,28);const wood=ctx.createLinearGradient(tx,ty,tx+tw,ty+th);wood.addColorStop(0,'#8a4b2b');wood.addColorStop(.5,'#5a331d');wood.addColorStop(1,'#b9633c');ctx.fillStyle=wood;ctx.fill();const rail=28,cx=tx+rail,cy=ty+rail,cw=tw-rail*2,ch=th-rail*2;round(ctx,cx,cy,cw,ch,10);ctx.fillStyle='#08aa7a';ctx.fill();ctx.strokeStyle='rgba(255,255,255,.42)';ctx.lineWidth=1;ctx.setLineDash([5,5]);for(let i=1;i<(land?8:4);i++){ctx.beginPath();ctx.moveTo(cx+cw*i/(land?8:4),cy);ctx.lineTo(cx+cw*i/(land?8:4),cy+ch);ctx.stroke()}for(let i=1;i<(land?4:8);i++){ctx.beginPath();ctx.moveTo(cx,cy+ch*i/(land?4:8));ctx.lineTo(cx+cw,cy+ch*i/(land?4:8));ctx.stroke()}ctx.setLineDash([]);(item.lines||[]).forEach(l=>drawLine(ctx,l,cx,cy,cw,ch));Object.entries(item.state||{}).forEach(([n,p])=>drawBall(ctx,n,cx+cw*p.x/100,cy+ch*p.y/100,Math.min(cw,ch)*.038));(item.notes||[]).forEach(n=>{ctx.fillStyle=n.background==='transparent'?'rgba(0,0,0,0)':(n.background||'#07110d');round(ctx,cx+cw*n.x/100,cy+ch*n.y/100,160,50,10);ctx.fill();ctx.fillStyle=n.color||'#ffe15b';ctx.font='bold 16px system-ui';ctx.fillText(n.text||'',cx+cw*n.x/100+10,cy+ch*n.y/100+28)});ctx.fillStyle='#050505';[[tx+20,ty+20],[tx+tw-20,ty+20],[tx+20,ty+th-20],[tx+tw-20,ty+th-20],[tx+tw/2,ty+14],[tx+tw/2,ty+th-14]].forEach(([x,y])=>{ctx.beginPath();ctx.arc(x,y,18,0,Math.PI*2);ctx.fill()});ctx.fillStyle='#fff';ctx.font='bold 18px system-ui';ctx.textAlign='center';ctx.fillText('撞点',W-side/2,70);drawBall(ctx,'cue',W-side/2,118,28);if(item.tip){ctx.fillStyle='#e6382e';ctx.beginPath();ctx.arc(W-side/2-28+item.tip.x*56,118-28+item.tip.y*56,4,0,Math.PI*2);ctx.fill()} }
function round(ctx,x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}function drawLine(ctx,l,cx,cy,cw,ch){ctx.save();ctx.strokeStyle=l.color||'#fff';ctx.lineWidth=l.width||4;ctx.beginPath();ctx.moveTo(cx+cw*l.x1/100,cy+ch*l.y1/100);ctx.lineTo(cx+cw*l.x2/100,cy+ch*l.y2/100);ctx.stroke();if(l.type!=='plain'){const x1=cx+cw*l.x1/100,y1=cy+ch*l.y1/100,x2=cx+cw*l.x2/100,y2=cy+ch*l.y2/100,a=Math.atan2(y2-y1,x2-x1);ctx.translate(x2,y2);ctx.rotate(a);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-14,-8);ctx.lineTo(-14,8);ctx.closePath();ctx.fillStyle=l.color||'#fff';ctx.fill()}ctx.restore()}function drawBall(ctx,n,x,y,r){const kind=ballKind(n);ctx.save();ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.clip();const g=ctx.createRadialGradient(x-r*.35,y-r*.35,1,x,y,r*1.2);if(kind==='cue'){g.addColorStop(0,'#fff');g.addColorStop(1,'#cfc8aa')}else if(kind==='ghost'){g.addColorStop(0,'rgba(255,255,255,.45)');g.addColorStop(1,'rgba(255,255,255,.12)')}else{g.addColorStop(0,'#fff');g.addColorStop(.18,BALL_COLORS[Number(kind)-1]||'#fff');g.addColorStop(1,'#111')}ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);ctx.restore();if(kind!=='cue'&&kind!=='ghost'){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,r*.43,0,Math.PI*2);ctx.fill();ctx.fillStyle='#111';ctx.font=`900 ${r*.7}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(kind,x,y)}}
function bind(){document.querySelectorAll('[data-score]').forEach(b=>b.onclick=()=>{const d=Number(b.dataset.delta);if(b.dataset.score==='left')left=Math.max(0,left+d);else right=Math.max(0,right+d);updateScore()});['leftName','rightName','date','shop','opponent','gameSelect','gameCustom','typeSelect','typeCustom','raceSelect','raceCustom','memo','layoutSelect'].forEach(id=>$(id).addEventListener('input',saveDraft));$('shopSelect').onchange=e=>{if(e.target.value){$('shop').value=e.target.value;saveDraft()}};$('recordOn').onclick=()=>setRecord(true);$('recordOff').onclick=()=>setRecord(false);$('resetAll').onclick=resetAll;$('startMatchTime').onclick=startMatchTimer;$('stopMatchTime').onclick=stopMatchTimer;$('toggleMatchTime').onclick=()=>{matchTimeVisible=!matchTimeVisible;$('matchTimeWrap').classList.toggle('hidden',!matchTimeVisible);$('toggleMatchTime').textContent=matchTimeVisible?'非表示':'表示';saveDraft()};$('leftMinutes').onchange=()=>{leftClock=Number($('leftMinutes').value)*60;updateClock();saveDraft()};$('rightMinutes').onchange=()=>{rightClock=Number($('rightMinutes').value)*60;updateClock();saveDraft()};$('leftClockCard').onclick=()=>startClock('left');$('rightClockCard').onclick=()=>startClock('right');$('stopClock').onclick=stopClock;$('saveMatch').onclick=saveRecord;$('layoutListBtn').onclick=()=>{renderLayoutList();$('layoutModal').classList.add('open')};$('viewLayoutImage').onclick=()=>showLayoutImage();$('closeLayoutModal').onclick=()=>$('layoutModal').classList.remove('open');$('closeImageModal').onclick=()=>$('imageModal').classList.remove('open');$('closeDetailModal').onclick=()=>$('detailModal').classList.remove('open');}
function init(){fillMinuteSelects();records=readJSON(STORAGE_MATCHES,[]);loadLayouts();renderShopOptions();bind();loadDraft();renderRecords();}
init();
</script>
