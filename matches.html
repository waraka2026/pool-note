<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#060504" />
<title>対戦記録｜ビリヤード配置図メーカー</title>
<style>
:root{--green:#07543d;--green2:#0b6b4f;--cream:#f7f5ee;--card:#fff;--line:#e7e2d7;--muted:#718078;--ink:#17251f;--brown:#6a4328;--brown2:#8b5a35;--win:#d9f5e7;--lose:#ffe0e0;--shadow:0 18px 42px rgba(0,0,0,.34)}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans JP","Yu Gothic",sans-serif;background:#050403 radial-gradient(circle at 82% 8%,rgba(15,120,83,.5),transparent 24rem)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{width:min(880px,calc(100% - 18px));margin:auto;padding:14px 0 30px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;color:#fff;margin-bottom:10px}.top h1{margin:0;font-size:clamp(24px,4vw,34px)}.top p{margin:4px 0 0;color:rgba(255,255,255,.74);font-size:12px}.top-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.top a,.top button{border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;text-decoration:none;border-radius:999px;padding:10px 13px;font-weight:900}.panel{background:var(--cream);border-radius:28px;box-shadow:var(--shadow);overflow:hidden;border:1px solid rgba(255,255,255,.2);margin-bottom:14px}.panel-head{background:linear-gradient(135deg,var(--green),var(--green2));color:#fff;padding:14px 18px;display:flex;justify-content:space-between;gap:12px;align-items:center}.panel-head h2{margin:0;font-size:20px}.panel-head span{display:block;margin-top:3px;color:rgba(255,255,255,.75);font-size:12px}.switch{display:flex;gap:6px;align-items:center;font-size:12px;font-weight:900}.switch input{width:auto}.content{padding:12px}.record-choice{display:flex;gap:9px;background:linear-gradient(135deg,var(--green),var(--green2));padding:10px;border-radius:22px 22px 0 0;justify-content:flex-end}.record-choice button{border:0;border-radius:999px;padding:10px 16px;font-weight:950}.record-choice .active{background:#fff;color:var(--green)}.score-panel{background:linear-gradient(145deg,#063a2d,#0a6a4d);border-radius:0 0 24px 24px;color:#fff;padding:18px 14px 20px;text-align:center}.match-time{display:flex;justify-content:center;align-items:center;gap:10px;margin:0 auto 14px}.match-time strong{font-size:28px;letter-spacing:.08em}.match-time button{border:0;border-radius:999px;padding:9px 13px;background:rgba(255,255,255,.16);color:#fff;font-weight:950}.match-time.hidden{display:none}.names{display:grid;grid-template-columns:1fr 70px 1fr;align-items:end;margin-bottom:8px}.player-name{width:100%;text-align:center;border:0;border-bottom:2px solid rgba(255,255,255,.24);background:transparent;color:#fff;font-weight:950;font-size:clamp(20px,4vw,34px);padding:7px 4px}.score-line{display:grid;grid-template-columns:1fr 1.15em 1fr;align-items:center;gap:clamp(28px,8vw,96px);justify-content:center}.num{font-size:clamp(86px,22vw,190px);line-height:.9;font-weight:1000;letter-spacing:.01em}.dash{font-size:clamp(54px,10vw,100px);font-weight:1000;color:rgba(255,255,255,.78)}.score-buttons{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:26px}.side-buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}.bigbtn{min-height:74px;border:0;border-radius:20px;background:linear-gradient(135deg,#18a871,#0b6b4f);color:#fff;font-size:28px;font-weight:1000;box-shadow:0 9px 18px rgba(0,0,0,.24)}.bigbtn.minus{background:#68726e}.clock{background:linear-gradient(135deg,var(--brown),var(--brown2));border-radius:22px;color:#fff;padding:14px;margin-top:12px}.clock-head{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:10px}.clock-head b{font-size:18px}.clock-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.clock-card{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.18);border-radius:18px;padding:12px}.clock-card.active{outline:3px solid rgba(255,255,255,.8)}.clock-card input{width:64px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.2);border-radius:10px;color:#fff;padding:8px;text-align:center;font-weight:900}.clock-card label{font-size:12px;color:rgba(255,255,255,.78);font-weight:800}.clock-time{font-size:34px;font-weight:1000;letter-spacing:.06em;margin:8px 0}.clock-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}.clock-actions button{border:0;border-radius:16px;padding:15px 8px;font-weight:1000;color:#fff;background:rgba(255,255,255,.18)}#clockStop{font-size:20px;background:#2a1b11}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.field{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:0 4px 12px rgba(18,36,28,.06)}.field.wide{grid-column:1/-1}.label{display:block;color:var(--muted);font-size:11px;font-weight:900;margin-bottom:5px}input,select,textarea{width:100%;border:0;outline:0;background:transparent;color:var(--ink);font-weight:800}textarea{min-height:74px;resize:vertical;line-height:1.6;font-weight:500}.custom-input{display:none;margin-top:8px;border-top:1px solid var(--line);padding-top:8px}.custom-input.show{display:block}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.btn{border:1px solid var(--line);border-radius:16px;background:#fff;color:#0a513d;padding:14px 10px;font-weight:950}.primary{width:100%;margin-top:12px;border:0;background:linear-gradient(135deg,var(--green),var(--green2));color:#fff;padding:16px;box-shadow:0 10px 18px rgba(8,84,61,.25)}.layout-box{background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px;margin-top:12px}.linked{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:13px;color:#356252}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px}.summary .field{text-align:center}.summary b{font-size:28px;color:var(--green)}.list{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}.row{display:grid;grid-template-columns:88px 1fr 60px 74px 54px;gap:8px;align-items:center;padding:11px 10px;border-bottom:1px solid #ece7dd;font-size:13px}.row:last-child{border-bottom:0}.head{color:var(--muted);font-weight:900;background:#fbfaf7}.badge{padding:4px 8px;border-radius:999px;font-weight:900;text-align:center}.win{background:var(--win);color:#087040}.lose{background:var(--lose);color:#c93a3a}.row button{border:0;background:transparent;color:var(--green);font-weight:950}.modal{position:fixed;inset:0;display:none;place-items:center;background:rgba(0,0,0,.62);z-index:20;padding:16px}.modal.open{display:grid}.modal-box{width:min(760px,100%);max-height:90dvh;overflow:auto;background:var(--cream);border-radius:26px;padding:16px;box-shadow:var(--shadow)}.modal-head{display:flex;justify-content:space-between;align-items:center}.modal-head h3{margin:0}.close{border:0;border-radius:50%;width:42px;height:42px;background:#fff;color:var(--green);font-weight:1000}.layout-list{display:grid;gap:10px;margin-top:12px}.layout-item{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.layout-item b{display:block}.layout-item small{color:var(--muted);white-space:pre-line}.layout-item button{border:0;border-radius:999px;background:var(--green);color:#fff;font-weight:950;padding:9px 12px}.canvas-wrap{background:#151b20;border-radius:18px;padding:12px;margin-top:12px;text-align:center}.canvas-wrap canvas{max-width:100%;height:auto;border-radius:12px}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(18px);background:#111;color:#fff;border-radius:999px;padding:12px 18px;opacity:0;transition:.22s;z-index:30}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (orientation:landscape) and (max-height:560px){.app{width:min(980px,calc(100% - 16px));padding-top:8px}.top{margin-bottom:6px}.top p{display:none}.score-panel{padding:10px 12px}.num{font-size:clamp(74px,18vw,132px)}.score-buttons{margin-top:18px}.bigbtn{min-height:58px}.clock{padding:10px}.clock-time{font-size:26px}.grid{grid-template-columns:repeat(3,1fr)}.field.wide{grid-column:1/-1}}
@media (max-width:680px){.top{display:block}.top-actions{justify-content:flex-start;margin-top:10px}.grid{grid-template-columns:1fr 1fr}.score-line{gap:22px}.score-buttons{grid-template-columns:1fr}.row{grid-template-columns:78px 1fr 50px 58px 50px;font-size:12px;padding-inline:8px}.clock-grid{grid-template-columns:1fr}.actions{grid-template-columns:1fr 1fr}.num{font-size:96px}.player-name{font-size:22px}}
</style>
</head>
<body>
<main class="app">
  <div class="top"><div><h1>対戦記録</h1><p>途中で別ページへ移動しても、スコア・時間・入力内容は自動保存されます。</p></div><div class="top-actions"><a href="index.html">← 配置図へ戻る</a></div></div>
  <section class="panel">
    <div class="record-choice"><button id="recordOn" class="active">記録する</button><button id="recordOff">記録しない</button><button id="resetAll">リセット</button></div>
    <div class="score-panel">
      <div id="matchTimeBox" class="match-time"><strong id="matchTime">00:00:00</strong><button id="toggleMatchTime">非表示</button><button id="startMatch">開始</button><button id="stopMatch">停止</button><button id="resetMatchTime">リセット</button></div>
      <div class="names"><input id="myName" class="player-name" value="自分"><span></span><input id="oppName" class="player-name" value="相手"></div>
      <div class="score-line"><div id="myScore" class="num">00</div><div class="dash">-</div><div id="oppScore" class="num">00</div></div>
      <div class="score-buttons"><div class="side-buttons"><button class="bigbtn" data-side="me" data-delta="1">+1</button><button class="bigbtn minus" data-side="me" data-delta="-1">-1</button></div><div class="side-buttons"><button class="bigbtn" data-side="op" data-delta="1">+1</button><button class="bigbtn minus" data-side="op" data-delta="-1">-1</button></div></div>
      <div class="clock">
        <div class="clock-head"><b>チェスクロック</b><span>持ち時間は分・秒のみ</span></div>
        <div class="clock-grid"><div id="meClockCard" class="clock-card active"><label>自分の持ち時間</label><div><input id="meMin" type="number" min="0" value="30"> 分 <input id="meSec" type="number" min="0" max="59" value="0"> 秒</div><div id="meRemain" class="clock-time">30:00</div></div><div id="opClockCard" class="clock-card"><label>相手の持ち時間</label><div><input id="opMin" type="number" min="0" value="30"> 分 <input id="opSec" type="number" min="0" max="59" value="0"> 秒</div><div id="opRemain" class="clock-time">30:00</div></div></div>
        <div class="clock-actions"><button id="meTurn">自分</button><button id="clockStop">停止</button><button id="opTurn">相手</button></div>
      </div>
    </div>
  </section>
  <section class="panel"><div class="panel-head"><div><h2>記録内容</h2><span>デフォルトはそのまま、必要なら自由入力</span></div><label class="switch"><input id="showTime" type="checkbox" checked>試合時間表示</label></div><div class="content">
    <div class="grid">
      <label class="field"><span class="label">日付</span><input id="date" type="date"></label>
      <label class="field"><span class="label">店舗名</span><input id="shop" list="shopList" placeholder="店舗名"><datalist id="shopList"></datalist></label>
      <label class="field"><span class="label">相手</span><input id="opponent" placeholder="相手名"></label>
      <label class="field"><span class="label">種目</span><select id="game"><option>9ボール</option><option>10ボール</option><option>エイトボール</option><option>ローテーション</option><option value="custom">自由入力</option></select><input id="gameCustom" class="custom-input" placeholder="種目を入力"></label>
      <label class="field"><span class="label">形式</span><select id="type"><option>平場</option><option>セットマッチ</option><option>大会</option><option>練習</option><option value="custom">自由入力</option></select><input id="typeCustom" class="custom-input" placeholder="形式を入力"></label>
      <label class="field"><span class="label">先取</span><select id="race"><option value="3">3先</option><option value="4">4先</option><option value="5">5先</option><option value="7">7先</option><option value="custom">自由</option></select><input id="raceCustom" class="custom-input" placeholder="例：10点先取 / 30分勝負"></label>
      <label class="field wide"><span class="label">メモ</span><textarea id="memo" placeholder="例：9番前の出しが薄くなった。次は厚めに残す。"></textarea></label>
    </div>
    <div class="layout-box"><label><span class="label">配置図メーカー</span><select id="layoutSelect"></select></label><div id="linkedText" class="linked">🔗 配置図を選ぶと、この試合に紐づけます</div><div class="actions"><button class="btn" id="layoutListBtn">配置図メーカーを見る</button><button class="btn" id="openSelectedLayout">選んだ配置図を画像で見る</button></div></div>
    <button class="btn primary" id="saveMatch">✓ 試合終了して保存</button>
  </div></section>
  <section class="panel"><div class="panel-head"><div><h2>対戦記録一覧</h2><span>保存した配置と同じように記録</span></div></div><div class="content"><div class="summary"><div class="field"><span class="label">対戦数</span><b id="totalCount">0</b></div><div class="field"><span class="label">勝ち</span><b id="winCount">0</b></div><div class="field"><span class="label">勝率</span><b id="winRate">0%</b></div></div><div class="list"><div class="row head"><span>日付</span><span>店名</span><span>相手</span><span>スコア</span><span>結果</span></div><div id="scoreRows"></div></div></div></section>
</main>
<div id="layoutModal" class="modal"><div class="modal-box"><div class="modal-head"><h3>保存した配置</h3><button class="close" id="closeModal">×</button></div><div id="layoutList" class="layout-list"></div></div></div>
<div id="imageModal" class="modal"><div class="modal-box"><div class="modal-head"><h3 id="imageTitle">配置図メーカー</h3><button class="close" id="closeImageModal">×</button></div><div class="canvas-wrap"><canvas id="layoutCanvas" width="900" height="560"></canvas></div></div></div>
<div id="toast" class="toast"></div>
<script>
const LS_MATCHES='poolMatchRecords',LS_LAYOUTS='poolNotes',LS_DRAFT='poolMatchDraft';
const $=id=>document.getElementById(id);let me=0,op=0,recording=true,matchSec=0,matchTimer=null,clockTimer=null,clockTurn=null,meRemain=1800,opRemain=1800,selectedLayoutId='';
const colors=['#f3d400','#1767c8','#e6382e','#6b3ba9','#ef7d15','#248046','#7b201d','#111','#f0d63b','#1767c8','#e6382e','#6b3ba9','#ef7d15','#248046','#7b201d'];
function pad(n){return String(Math.max(0,n)).padStart(2,'0')}function hms(s){return `${pad(Math.floor(s/3600))}:${pad(Math.floor(s%3600/60))}:${pad(s%60)}`}function ms(s){return `${pad(Math.floor(s/60))}:${pad(s%60)}`}function today(){return new Date().toISOString().slice(0,10)}
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1600)}
function layouts(){return JSON.parse(localStorage.getItem(LS_LAYOUTS)||'[]')}function matches(){return JSON.parse(localStorage.getItem(LS_MATCHES)||'[]')}function saveMatches(v){localStorage.setItem(LS_MATCHES,JSON.stringify(v.slice(0,100)))}
function formatScore(){ $('myScore').textContent=pad(me);$('oppScore').textContent=pad(op)}
function updateClock(){ $('matchTime').textContent=hms(matchSec);$('meRemain').textContent=ms(meRemain);$('opRemain').textContent=ms(opRemain);$('meClockCard').classList.toggle('active',clockTurn==='me');$('opClockCard').classList.toggle('active',clockTurn==='op') }
function totalFromInputs(prefix){return Math.max(0,Number($(prefix+'Min').value||0))*60+Math.min(59,Math.max(0,Number($(prefix+'Sec').value||0)))}
function saveDraft(){const d={me,op,recording,matchSec,meRemain,opRemain,clockTurn,selectedLayoutId,showTime:$('showTime').checked,myName:$('myName').value,oppName:$('oppName').value,date:$('date').value,shop:$('shop').value,opponent:$('opponent').value,game:$('game').value,gameCustom:$('gameCustom').value,type:$('type').value,typeCustom:$('typeCustom').value,race:$('race').value,raceCustom:$('raceCustom').value,memo:$('memo').value,meMin:$('meMin').value,meSec:$('meSec').value,opMin:$('opMin').value,opSec:$('opSec').value};localStorage.setItem(LS_DRAFT,JSON.stringify(d))}
function loadDraft(){const d=JSON.parse(localStorage.getItem(LS_DRAFT)||'null');$('date').value=today();if(!d)return;Object.assign(window,{}) ;me=d.me||0;op=d.op||0;recording=d.recording!==false;matchSec=d.matchSec||0;meRemain=d.meRemain??1800;opRemain=d.opRemain??1800;clockTurn=d.clockTurn||null;selectedLayoutId=d.selectedLayoutId||'';['myName','oppName','date','shop','opponent','game','gameCustom','type','typeCustom','race','raceCustom','memo','meMin','meSec','opMin','opSec'].forEach(id=>{if(d[id]!=null)$(id).value=d[id]});$('showTime').checked=d.showTime!==false;}
function wireAutoSave(){document.querySelectorAll('input,select,textarea').forEach(el=>el.addEventListener('input',()=>{toggleCustom();refreshShopList();saveDraft()}));window.addEventListener('beforeunload',saveDraft);document.addEventListener('visibilitychange',()=>{if(document.hidden)saveDraft()})}
function toggleCustom(){ $('gameCustom').classList.toggle('show',$('game').value==='custom');$('typeCustom').classList.toggle('show',$('type').value==='custom');$('raceCustom').classList.toggle('show',$('race').value==='custom');$('matchTimeBox').classList.toggle('hidden',!$('showTime').checked) }
function refreshRecordBtns(){ $('recordOn').classList.toggle('active',recording);$('recordOff').classList.toggle('active',!recording)}
function resetAll(){me=0;op=0;matchSec=0;clockTurn=null;meRemain=totalFromInputs('me')||1800;opRemain=totalFromInputs('op')||1800;['memo'].forEach(id=>$(id).value='');formatScore();updateClock();saveDraft();toast('リセットしました')}
function refreshLayouts(){const sel=$('layoutSelect');const items=layouts();sel.innerHTML='<option value="">配置図なし</option>'+items.map(x=>`<option value="${x.id}">${x.title||'名称なし'}｜${timeText(x.updatedAt||x.createdAt||x.date)}</option>`).join('');sel.value=selectedLayoutId||'';refreshLinked()}
function refreshLinked(){const item=layouts().find(x=>String(x.id)===String($('layoutSelect').value));selectedLayoutId=$('layoutSelect').value;$('linkedText').textContent=item?`🔗 ${item.title||'名称なし'} をこの試合に紐づけ中`:'🔗 配置図なし';saveDraft()}
function timeText(v){if(!v)return'日時不明';const d=new Date(v);return Number.isNaN(d.getTime())?String(v):d.toLocaleString('ja-JP',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}
function refreshShopList(){const base=['快活百合ヶ丘','BAGUS新宿','セスパ','パラダイスたまプラーザ','ジーク','NORA','ミッドナイト','Pool＆Chill','ロサ'];const past=matches().map(m=>m.shop).filter(Boolean);const shops=[...new Set([...past,...base])];$('shopList').innerHTML=shops.map(s=>`<option value="${s}"></option>`).join('')}
function getVal(selectId,customId){return $(selectId).value==='custom'?$(customId).value:$(selectId).selectedOptions[0]?.textContent||''}
function saveMatch(){if(!recording){toast('記録しない設定です');return}const result=me>op?'勝ち':me<op?'負け':'引分';const layout=layouts().find(x=>String(x.id)===String(selectedLayoutId));const rec={id:Date.now(),date:$('date').value,shop:$('shop').value,opponent:$('opponent').value,game:getVal('game','gameCustom'),type:getVal('type','typeCustom'),race:getVal('race','raceCustom'),myName:$('myName').value,oppName:$('oppName').value,myScore:me,oppScore:op,result,matchTime:hms(matchSec),meClockSet:ms(totalFromInputs('me')),opClockSet:ms(totalFromInputs('op')),meRemain:ms(meRemain),opRemain:ms(opRemain),memo:$('memo').value,layoutId:selectedLayoutId,layoutTitle:layout?.title||'',createdAt:new Date().toISOString()};const arr=matches();arr.unshift(rec);saveMatches(arr);refreshShopList();renderList();toast('対戦記録に保存しました')}
function renderList(){const arr=matches();const total=arr.length,w=arr.filter(x=>x.result==='勝ち').length;$('totalCount').textContent=total;$('winCount').textContent=w;$('winRate').textContent=total?Math.round(w/total*100)+'%':'0%';$('scoreRows').innerHTML=arr.length?arr.map(r=>`<div class="row"><span>${(r.date||'').replaceAll('-','/').slice(5)||'-'}</span><span>${r.shop||'-'}</span><span>${r.opponent||'-'}</span><span>${pad(r.myScore)}-${pad(r.oppScore)}</span><span class="badge ${r.result==='勝ち'?'win':'lose'}">${r.result}</span></div>`).join(''):'<div class="row"><span></span><span>まだ記録がありません</span><span></span><span></span><span></span></div>'}
function renderLayoutList(){const box=$('layoutList'),items=layouts();box.innerHTML=items.length?items.map(x=>`<div class="layout-item"><div><b>${x.title||'名称なし'}</b><small>${timeText(x.updatedAt||x.createdAt||x.date)}</small></div><div><button data-use="${x.id}">選ぶ</button> <button data-view="${x.id}">画像</button></div></div>`).join(''):'<div class="layout-item"><div><b>保存した配置はまだありません</b><small>配置図メーカーで保存するとここに出ます</small></div></div>';box.querySelectorAll('[data-use]').forEach(b=>b.onclick=()=>{selectedLayoutId=b.dataset.use;refreshLayouts();$('layoutModal').classList.remove('open');toast('配置図を紐づけました')});box.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>openLayoutImage(b.dataset.view))}
function drawLayout(item){const c=$('layoutCanvas'),ctx=c.getContext('2d'),land=item.orientation==='landscape',W=land?900:520,H=land?520:900;c.width=W;c.height=H;ctx.clearRect(0,0,W,H);ctx.fillStyle='#151b20';ctx.fillRect(0,0,W,H);const padv=24,extra=land?80:70,fw=W-extra-padv*2,fh=H-padv*2,x=padv,y=padv;round(ctx,x,y,fw,fh,24);ctx.fillStyle='#5a331d';ctx.fill();round(ctx,x+18,y+18,fw-36,fh-36,12);ctx.fillStyle='#0baa7a';ctx.fill();ctx.save();ctx.beginPath();ctx.rect(x+18,y+18,fw-36,fh-36);ctx.clip();ctx.strokeStyle='rgba(255,255,255,.35)';ctx.setLineDash([4,5]);for(let i=1;i<(land?8:4);i++){ctx.beginPath();ctx.moveTo(x+18+(fw-36)*i/(land?8:4),y+18);ctx.lineTo(x+18+(fw-36)*i/(land?8:4),y+fh-18);ctx.stroke()}for(let i=1;i<(land?4:8);i++){ctx.beginPath();ctx.moveTo(x+18,y+18+(fh-36)*i/(land?4:8));ctx.lineTo(x+fw-18,y+18+(fh-36)*i/(land?4:8));ctx.stroke()}ctx.setLineDash([]);(item.lines||[]).forEach(l=>{const ax=x+18+(fw-36)*l.x1/100,ay=y+18+(fh-36)*l.y1/100,bx=x+18+(fw-36)*l.x2/100,by=y+18+(fh-36)*l.y2/100;ctx.strokeStyle=l.color||'#fff';ctx.lineWidth=(l.width||2)*2;ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(bx,by);ctx.stroke();if(l.type!=='plain'){const a=Math.atan2(by-ay,bx-ax);ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(bx-18*Math.cos(a-.45),by-18*Math.sin(a-.45));ctx.lineTo(bx-18*Math.cos(a+.45),by-18*Math.sin(a+.45));ctx.closePath();ctx.fillStyle=l.color||'#fff';ctx.fill()}});Object.entries(item.state||{}).forEach(([n,p])=>drawBall(ctx,n,x+18+(fw-36)*p.x/100,y+18+(fh-36)*p.y/100,13));(item.notes||[]).forEach(n=>{ctx.fillStyle=n.background||'rgba(0,0,0,.72)';ctx.fillRect(x+18+(fw-36)*n.x/100,y+18+(fh-36)*n.y/100,130,38);ctx.fillStyle=n.color||'#ffe15b';ctx.font='14px sans-serif';ctx.fillText(n.text||'',x+24+(fw-36)*n.x/100,y+42+(fh-36)*n.y/100)});ctx.restore();ctx.fillStyle='#050505';[[x+18,y+18],[x+fw-18,y+18],[x+18,y+fh-18],[x+fw-18,y+fh-18],[x+fw/2,y+18],[x+fw/2,y+fh-18]].forEach(p=>{ctx.beginPath();ctx.arc(p[0],p[1],15,0,Math.PI*2);ctx.fill()});ctx.fillStyle='#ddd';ctx.font='bold 16px sans-serif';ctx.textAlign='center';ctx.fillText('撞点',W-extra/2,30);drawBall(ctx,'cue',W-extra/2,70,26);if(item.tip){ctx.fillStyle='#e6382e';ctx.beginPath();ctx.arc(W-extra/2-26+item.tip.x*52,70-26+item.tip.y*52,4,0,Math.PI*2);ctx.fill()}}
function round(ctx,x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}function kind(n){const s=String(n);return s==='cue'||s.startsWith('cue-')?'cue':s==='ghost'||s.startsWith('ghost-')?'ghost':s}function drawBall(ctx,n,x,y,r){const k=kind(n);ctx.save();ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=k==='cue'?'#fff':k==='ghost'?'rgba(255,255,255,.35)':colors[Number(k)-1]||'#fff';ctx.fill();if(k!=='cue'&&k!=='ghost'){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,r*.48,0,Math.PI*2);ctx.fill();ctx.fillStyle='#111';ctx.font='bold 10px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(k,x,y)}ctx.restore()}
function openLayoutImage(id){const item=layouts().find(x=>String(x.id)===String(id||selectedLayoutId));if(!item){toast('配置図が選ばれていません');return}$('imageTitle').textContent=item.title||'配置図メーカー';$('imageModal').classList.add('open');setTimeout(()=>drawLayout(item),30)}
function startClock(turn){clockTurn=turn;if(clockTimer)clearInterval(clockTimer);clockTimer=setInterval(()=>{if(clockTurn==='me')meRemain=Math.max(0,meRemain-1);if(clockTurn==='op')opRemain=Math.max(0,opRemain-1);updateClock();saveDraft()},1000);updateClock();saveDraft()}
function stopClock(){clockTurn=null;if(clockTimer)clearInterval(clockTimer);clockTimer=null;updateClock();saveDraft()}
function init(){loadDraft();formatScore();toggleCustom();refreshRecordBtns();refreshLayouts();refreshShopList();renderList();updateClock();wireAutoSave();document.querySelectorAll('[data-side]').forEach(b=>b.onclick=()=>{if(b.dataset.side==='me')me=Math.max(0,me+Number(b.dataset.delta));else op=Math.max(0,op+Number(b.dataset.delta));formatScore();saveDraft()});$('recordOn').onclick=()=>{recording=true;refreshRecordBtns();saveDraft()};$('recordOff').onclick=()=>{recording=false;refreshRecordBtns();saveDraft()};$('resetAll').onclick=resetAll;$('resetMatchTime').onclick=()=>{matchSec=0;updateClock();saveDraft()};$('startMatch').onclick=()=>{if(matchTimer)return;matchTimer=setInterval(()=>{matchSec++;updateClock();saveDraft()},1000)};$('stopMatch').onclick=()=>{clearInterval(matchTimer);matchTimer=null;saveDraft()};$('toggleMatchTime').onclick=()=>{$('showTime').checked=false;toggleCustom();saveDraft()};$('showTime').onchange=()=>{toggleCustom();saveDraft()};['meMin','meSec'].forEach(id=>$(id).onchange=()=>{if(clockTurn!=='me')meRemain=totalFromInputs('me');updateClock();saveDraft()});['opMin','opSec'].forEach(id=>$(id).onchange=()=>{if(clockTurn!=='op')opRemain=totalFromInputs('op');updateClock();saveDraft()});$('meTurn').onclick=()=>startClock('me');$('opTurn').onclick=()=>startClock('op');$('clockStop').onclick=stopClock;$('layoutSelect').onchange=refreshLinked;$('layoutListBtn').onclick=()=>{renderLayoutList();$('layoutModal').classList.add('open')};$('closeModal').onclick=()=>$('layoutModal').classList.remove('open');$('closeImageModal').onclick=()=>$('imageModal').classList.remove('open');$('openSelectedLayout').onclick=()=>openLayoutImage();$('saveMatch').onclick=saveMatch}
init();
</script>
