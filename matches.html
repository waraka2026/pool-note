<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#050806" />
<title>対戦記録｜ビリヤード配置図メーカー</title>
<style>
:root{--green:#07543d;--green2:#0b6b4f;--deep:#04251c;--cream:#f7f5ee;--card:#fff;--line:#e7e2d7;--muted:#718078;--win:#d9f5e7;--lose:#ffe0e0;--ink:#16231d;--brown:#7a421f;--brown2:#5d321b;--shadow:0 16px 38px rgba(0,0,0,.24)}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans JP","Yu Gothic",sans-serif;background:#030503}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{width:min(980px,calc(100% - 22px));margin:auto;padding:18px 0 30px}.top{color:#fff;margin-bottom:14px}.top h1{font-size:clamp(30px,7vw,46px);line-height:1.15;margin:0 0 12px}.top p{margin:0;color:rgba(255,255,255,.72);font-size:15px;line-height:1.8}.top-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.top a,.top button{border:1px solid rgba(255,255,255,.32);background:rgba(255,255,255,.12);color:#fff;text-decoration:none;border-radius:999px;padding:10px 14px;font-weight:900}.record-choice{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0 10px}.choice-btn{border:0;border-radius:999px;background:#fff;color:#083d2f;padding:12px 24px;font-weight:950;font-size:18px;box-shadow:0 6px 14px rgba(0,0,0,.16)}.choice-btn.secondary{color:#222;background:#eee}.choice-btn.active{background:linear-gradient(135deg,#12a874,#087655);color:#fff}.board{border:1.5px solid rgba(255,255,255,.86);border-radius:26px;overflow:hidden;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.05),transparent 24rem),linear-gradient(145deg,#07543d,#044130);box-shadow:var(--shadow)}.section{padding:18px}.timer-strip{display:flex;align-items:center;gap:12px;justify-content:center;margin:2px 0 14px;color:#fff}.match-time{font-size:clamp(30px,8vw,52px);font-weight:950;letter-spacing:.03em;white-space:nowrap}.mini-btn{border:0;border-radius:999px;background:rgba(255,255,255,.18);color:#fff;padding:12px 16px;font-weight:950;font-size:17px;min-height:48px}.score-card{padding:18px 16px 20px;border-radius:24px;background:linear-gradient(145deg,#06523b,#063f2e);color:#fff}.names{display:grid;grid-template-columns:minmax(0,1fr) 70px minmax(0,1fr);gap:18px;align-items:end}.name-field{background:transparent;border:0;border-bottom:4px solid rgba(255,255,255,.22);border-radius:0;color:#fff;text-align:center;font-size:clamp(30px,8vw,52px);font-weight:950;padding:6px 4px 10px}.name-field::placeholder{color:rgba(255,255,255,.7)}.score-row{display:grid;grid-template-columns:minmax(0,1fr) 78px minmax(0,1fr);gap:20px;align-items:center;text-align:center;margin-top:12px}.num{font-size:clamp(82px,23vw,170px);line-height:.92;font-weight:950;letter-spacing:.02em}.dash{font-size:clamp(54px,13vw,100px);font-weight:950;color:rgba(255,255,255,.8);padding-top:18px}.score-buttons{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}.score-btn{border:0;border-radius:22px;min-height:82px;color:#fff;font-size:clamp(30px,8vw,56px);font-weight:950;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),0 8px 14px rgba(0,0,0,.22)}.score-btn.plus{background:linear-gradient(135deg,#12b77a,#07845e)}.score-btn.minus{background:#6d7772}.clock{margin-top:18px;border-radius:26px;background:linear-gradient(145deg,var(--brown),var(--brown2));color:#fff;padding:18px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}.clock-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}.clock-head h2{margin:0;font-size:clamp(28px,7vw,44px);line-height:1.2}.clock-head span{font-size:15px;color:rgba(255,255,255,.72);font-weight:850}.clock-presets{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:12px}.preset{display:grid;gap:8px}.preset label{font-size:16px;font-weight:950}.preset select{width:100%;border:0;border-radius:16px;background:#fff;color:#2b1a12;padding:12px 14px;font-size:22px;font-weight:950}.clock-faces{display:grid;grid-template-columns:1fr 1fr;gap:14px}.clock-face{border:3px solid rgba(255,255,255,.26);border-radius:22px;padding:16px 8px;text-align:center;background:rgba(0,0,0,.14)}.clock-face.active{background:rgba(255,255,255,.16);box-shadow:0 0 0 3px rgba(255,255,255,.18)}.clock-face b{display:block;font-size:32px;margin-bottom:6px}.clock-face strong{font-size:clamp(54px,14vw,92px);line-height:1;font-weight:950}.clock-stop{width:100%;border:0;border-radius:22px;background:#fff;color:#2b1a12;margin-top:16px;min-height:76px;font-size:36px;font-weight:950}.form-panel{margin-top:18px;background:var(--cream);border-radius:24px;overflow:hidden}.panel-head{background:linear-gradient(135deg,var(--green),var(--green2));color:#fff;padding:16px 18px}.panel-head h2{margin:0;font-size:25px}.panel-head span{display:block;margin-top:4px;color:rgba(255,255,255,.75);font-size:13px}.content{padding:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:0 4px 12px rgba(18,36,28,.06)}.label{display:block;color:var(--muted);font-size:12px;font-weight:900;margin-bottom:5px}input,select,textarea{width:100%;border:0;outline:0;background:transparent;color:var(--ink);font-weight:800}textarea{min-height:80px;resize:vertical;line-height:1.6;font-weight:500}.free-input{display:none;margin-top:8px;border-top:1px solid var(--line);padding-top:8px}.shop-suggest{display:none;margin-top:8px;border-top:1px solid var(--line);padding-top:8px}.shop-suggest.show{display:block}.layout-box{margin-top:12px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px}.layout-title{font-size:26px;font-weight:950;color:#0b3e30;margin:0 0 8px}.layout-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.btn{border:1px solid var(--line);border-radius:16px;background:#fff;color:#0a513d;padding:12px 14px;font-weight:950}.btn.primary{width:100%;margin-top:12px;background:linear-gradient(135deg,var(--green),var(--green2));color:#fff;border:0;padding:16px;font-size:20px}.records{margin-top:18px;background:var(--cream);border-radius:24px;overflow:hidden}.table-wrap{overflow:auto}.records-table{width:100%;border-collapse:collapse;background:#fff;min-width:900px}.records-table th,.records-table td{border-bottom:1px solid #ece7dd;padding:10px 8px;text-align:left;font-size:13px;vertical-align:top}.records-table th{background:#fbfaf7;color:var(--muted);font-weight:950}.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-weight:950}.win{background:var(--win);color:#087040}.lose{background:var(--lose);color:#c93a3a}.row-actions{display:flex;gap:6px}.row-actions button{border:0;border-radius:999px;background:#eef6f2;color:#07543d;padding:7px 10px;font-weight:900}.row-actions .danger{background:#ffe6e6;color:#b62222}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(18px);background:#111;color:#fff;border-radius:999px;padding:12px 18px;opacity:0;transition:.22s;z-index:30}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.modal{position:fixed;inset:0;display:none;place-items:center;background:rgba(0,0,0,.58);z-index:20;padding:18px}.modal.open{display:grid}.modal-box{width:min(760px,100%);max-height:88dvh;overflow:auto;background:#f7f5ee;border-radius:26px;padding:16px;box-shadow:var(--shadow)}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.modal-head h3{margin:0;font-size:28px}.close{border:0;border-radius:50%;width:48px;height:48px;background:#fff;color:#0a513d;font-size:26px;font-weight:950}.layout-list{display:grid;gap:10px;margin-top:12px}.layout-item{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px}.layout-item b{display:block;font-size:18px}.layout-item small{color:var(--muted)}.layout-item button{margin-top:8px}.image-preview{display:grid;place-items:center}.image-preview canvas{max-width:100%;height:auto;border-radius:18px;background:#12191d}@media(max-width:720px){.app{width:100%;padding:0 0 24px}.top{padding:28px 18px 10px}.top h1{font-size:38px}.top-actions{margin-top:18px}.record-choice{justify-content:space-between;padding:0 18px;margin:8px 0 10px}.choice-btn{font-size:18px;padding:10px 16px;min-width:30%;box-shadow:none}.board{border-radius:26px 26px 0 0;border-left:1.5px solid rgba(255,255,255,.86);border-right:1.5px solid rgba(255,255,255,.86);border-bottom:1.5px solid rgba(255,255,255,.86)}.section{padding:16px 14px}.timer-strip{justify-content:flex-start;overflow-x:auto}.match-time{font-size:42px;min-width:max-content}.mini-btn{font-size:18px;min-height:56px;padding:10px 16px}.names{grid-template-columns:minmax(0,1fr) 40px minmax(0,1fr);gap:12px}.score-row{grid-template-columns:minmax(0,1fr) 44px minmax(0,1fr);gap:14px}.name-field{font-size:40px}.num{font-size:112px}.dash{font-size:72px}.score-buttons{grid-template-columns:1fr 1fr;gap:12px}.score-btn{min-height:86px;border-radius:20px}.clock{padding:18px 14px}.clock-head{align-items:flex-start}.clock-head h2{font-size:38px;max-width:45%;word-break:keep-all}.clock-head span{font-size:18px;line-height:1.5;padding-top:7px}.clock-presets{align-items:end}.preset label{font-size:18px}.preset select{font-size:23px;padding:12px}.clock-face b{font-size:34px}.clock-face strong{font-size:58px}.clock-stop{font-size:34px;min-height:76px}.grid{grid-template-columns:1fr 1fr}.records-table th,.records-table td{font-size:12px}.layout-box::after{content:none!important}}
</style>
</head>
<body>
<main class="app">
  <section class="top"><h1>対戦記録</h1><p>途中で別ページへ移動しても、スコア・時間・入力内容は自動保存されます。</p><div class="top-actions"><a href="index.html">← 配置図へ戻る</a></div></section>
  <div class="record-choice"><button id="recordOn" class="choice-btn active">記録する</button><button id="recordOff" class="choice-btn secondary">記録しない</button><button id="resetAll" class="choice-btn secondary">リセット</button></div>
  <section class="board"><div class="section">
    <div id="timerStrip" class="timer-strip"><div id="matchTime" class="match-time">00:00:00</div><button id="toggleTime" class="mini-btn">非表示</button><button id="timeStart" class="mini-btn">開始</button><button id="timeStop" class="mini-btn">停止</button></div>
    <section class="score-card"><div class="names"><input id="leftName" class="name-field" value="自分"><span></span><input id="rightName" class="name-field" value="相手"></div><div class="score-row"><div id="leftScore" class="num">00</div><div class="dash">-</div><div id="rightScore" class="num">00</div></div><div class="score-buttons"><button class="score-btn plus" data-score="left" data-delta="1">+1</button><button class="score-btn minus" data-score="left" data-delta="-1">-1</button><button class="score-btn plus" data-score="right" data-delta="1">+1</button><button class="score-btn minus" data-score="right" data-delta="-1">-1</button></div></section>
    <section class="clock"><div class="clock-head"><h2>チェスクロック</h2><span>左右の枠をタップして開始</span></div><div class="clock-presets"><div class="preset"><label>左の持ち時間</label><select id="leftClockSelect"></select></div><div class="preset"><label>右の持ち時間</label><select id="rightClockSelect"></select></div></div><div class="clock-faces"><button id="leftClockFace" class="clock-face"><b>左</b><strong id="leftClock">10:00</strong></button><button id="rightClockFace" class="clock-face"><b>右</b><strong id="rightClock">10:00</strong></button></div><button id="clockStopReset" class="clock-stop">停止 / リセット</button></section>
  </div></section>
  <section class="form-panel"><div class="panel-head"><h2>記録内容</h2><span>保存する内容だけ下で入力</span></div><div class="content"><div class="grid">
    <label class="field"><span class="label">日付</span><input id="date" type="date"></label>
    <label class="field"><span class="label">店舗名</span><input id="shop" placeholder="店舗名を入力・選択"><select id="shopSelect" class="shop-suggest"></select></label>
    <label class="field"><span class="label">相手</span><input id="opponent" placeholder="相手名"></label>
    <label class="field"><span class="label">種目</span><select id="game"><option>9ボール</option><option>10ボール</option><option>エイトボール</option><option>ローテーション</option><option>自由入力</option></select><input id="gameFree" class="free-input" placeholder="種目を自由入力"></label>
    <label class="field"><span class="label">形式</span><select id="type"><option>平場</option><option>セットマッチ</option><option>大会</option><option>練習</option><option>自由入力</option></select><input id="typeFree" class="free-input" placeholder="形式を自由入力"></label>
    <label class="field"><span class="label">先取</span><select id="race"><option>3先</option><option>4先</option><option>5先</option><option>7先</option><option>自由入力</option></select><input id="raceFree" class="free-input" placeholder="例：点数制・10点"></label>
  </div>
  <div class="layout-box"><p class="layout-title">配置図メーカー</p><label><span class="label">この試合に紐づける配置図</span><select id="layoutSelect"></select></label><div class="layout-actions"><button id="layoutListBtn" class="btn">保存した配置図を見る</button><button id="layoutImageBtn" class="btn">選んだ配置図を画像で見る</button></div><small id="linkedText">配置図を選ぶと、この試合の配置として保存されます。</small></div>
  <label class="field" style="display:block;margin-top:12px"><span class="label">メモ</span><textarea id="memo" placeholder="例：9番前の出しが薄くなった。次は厚めに残す。"></textarea></label>
  <button id="saveMatch" class="btn primary">✓ 試合終了して保存</button></div></section>
  <section class="records"><div class="panel-head"><h2>対戦記録一覧表</h2><span>編集・削除・詳細確認</span></div><div class="table-wrap"><table class="records-table"><thead><tr><th>日付</th><th>店舗</th><th>左</th><th>右</th><th>スコア</th><th>結果</th><th>試合時間</th><th>チェスクロック</th><th>種目/形式/先取</th><th>配置図/メモ</th><th>操作</th></tr></thead><tbody id="recordsBody"></tbody></table></div></section>
</main>
<div id="layoutModal" class="modal"><div class="modal-box"><div class="modal-head"><h3>保存した配置</h3><button id="closeLayout" class="close">×</button></div><div id="layoutList" class="layout-list"></div></div></div>
<div id="imageModal" class="modal"><div class="modal-box"><div class="modal-head"><h3 id="imageTitle">配置図メーカー</h3><button id="closeImage" class="close">×</button></div><div id="imagePreview" class="image-preview"></div></div></div>
<div id="toast" class="toast"></div>
<script>
const $=s=>document.querySelector(s),store={draft:'poolMatchDraft',matches:'poolMatchRecords',layouts:'poolNotes'};let left=0,right=0,recording=true,editingId=null,matchSec=0,matchTimer=null,timeVisible=true,clockRun=null,clockLast=0,clockLeft=600,clockRight=600,lastStopTap=0;
function pad(n){return String(n).padStart(2,'0')}function fmtSec(s){s=Math.max(0,Math.floor(s));return pad(s/3600|0)+':'+pad((s%3600)/60|0)+':'+pad(s%60)}function fmtMinSec(s){s=Math.max(0,Math.floor(s));return pad(s/60|0)+':'+pad(s%60)}function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),1500)}function load(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}}function save(k,v){localStorage.setItem(k,JSON.stringify(v))}
for(let m=10;m<=120;m+=5){$('#leftClockSelect').add(new Option(m+'分',m));$('#rightClockSelect').add(new Option(m+'分',m))}
function shops(){const base=['快活百合ヶ丘','BAGUS新宿','セスパ','ジーク','NORA','パラダイスたまプラ','ロサ','Pool & Chill'];const used=load(store.matches,[]).map(r=>r.shop).filter(Boolean);return [...new Set([...used,...base])]}function refreshShop(){const sel=$('#shopSelect');sel.innerHTML='<option value="">店舗を選択</option>'+shops().map(s=>`<option>${s}</option>`).join('')}refreshShop();$('#shop').addEventListener('focus',()=>{$('#shopSelect').classList.add('show');refreshShop()});$('#shop').addEventListener('click',()=>{$('#shopSelect').classList.add('show');refreshShop()});$('#shopSelect').onchange=e=>{if(e.target.value){$('#shop').value=e.target.value;autoSave()}};
function updateScore(){ $('#leftScore').textContent=pad(left); $('#rightScore').textContent=pad(right); autoSave()}document.querySelectorAll('[data-score]').forEach(b=>b.onclick=()=>{if(b.dataset.score==='left')left=Math.max(0,left+Number(b.dataset.delta));else right=Math.max(0,right+Number(b.dataset.delta));updateScore()});
function updateClock(){ $('#matchTime').textContent=fmtSec(matchSec);$('#leftClock').textContent=fmtMinSec(clockLeft);$('#rightClock').textContent=fmtMinSec(clockRight);$('#leftClockFace').classList.toggle('active',clockRun==='left');$('#rightClockFace').classList.toggle('active',clockRun==='right')}function tick(){const now=Date.now(),d=(now-clockLast)/1000;clockLast=now;matchSec+=d;if(clockRun==='left')clockLeft=Math.max(0,clockLeft-d);if(clockRun==='right')clockRight=Math.max(0,clockRight-d);updateClock();autoSave(false)}function startMatchTime(){if(!matchTimer){clockLast=Date.now();matchTimer=setInterval(tick,250)}}function stopTimers(){clearInterval(matchTimer);matchTimer=null;clockRun=null;updateClock();autoSave()}$('#timeStart').onclick=()=>startMatchTime();$('#timeStop').onclick=()=>stopTimers();$('#toggleTime').onclick=()=>{timeVisible=!timeVisible;$('#matchTime').style.display=timeVisible?'block':'none';$('#toggleTime').textContent=timeVisible?'非表示':'表示';autoSave()};$('#leftClockFace').onclick=()=>{clockRun='left';clockLast=Date.now();startMatchTime();updateClock()};$('#rightClockFace').onclick=()=>{clockRun='right';clockLast=Date.now();startMatchTime();updateClock()};$('#clockStopReset').onclick=()=>{const now=Date.now();if(now-lastStopTap<650){clockLeft=Number($('#leftClockSelect').value)*60;clockRight=Number($('#rightClockSelect').value)*60;clockRun=null;updateClock();toast('チェスクロックをリセット')}else{clockRun=null;updateClock();toast('停止')}lastStopTap=now;autoSave()};['leftClockSelect','rightClockSelect'].forEach(id=>$( '#'+id).onchange=e=>{if(id==='leftClockSelect')clockLeft=Number(e.target.value)*60;else clockRight=Number(e.target.value)*60;updateClock();autoSave()});
function toggleFree(sel,input){$(sel).onchange=()=>{$(input).style.display=$(sel).value==='自由入力'?'block':'none';autoSave()}}toggleFree('#game','#gameFree');toggleFree('#type','#typeFree');toggleFree('#race','#raceFree');
function layouts(){return load(store.layouts,[])}function refreshLayouts(){const arr=layouts();$('#layoutSelect').innerHTML='<option value="">配置図なし</option>'+arr.map(x=>`<option value="${x.id}">${x.title||'名称なし'}｜${x.date||''}</option>`).join('')}refreshLayouts();$('#layoutSelect').onchange=()=>autoSave();
function formObj(){const lid=$('#layoutSelect').value,l=layouts().find(x=>String(x.id)===String(lid));return{id:editingId||Date.now(),date:$('#date').value,shop:$('#shop').value,opponent:$('#opponent').value,leftName:$('#leftName').value||'左',rightName:$('#rightName').value||'右',game:$('#game').value==='自由入力'?$('#gameFree').value:$('#game').value,type:$('#type').value==='自由入力'?$('#typeFree').value:$('#type').value,race:$('#race').value==='自由入力'?$('#raceFree').value:$('#race').value,left,right,result:left>right?'勝ち':left<right?'負け':'引き分け',matchSec:Math.floor(matchSec),clockLeftStart:Number($('#leftClockSelect').value)*60,clockRightStart:Number($('#rightClockSelect').value)*60,clockLeft:Math.floor(clockLeft),clockRight:Math.floor(clockRight),layoutId:lid,layoutTitle:l?l.title||'名称なし':'配置図なし',memo:$('#memo').value,createdAt:new Date().toISOString()}}
function draftObj(){return{...formObj(),recording,timeVisible,gameSel:$('#game').value,typeSel:$('#type').value,raceSel:$('#race').value,gameFree:$('#gameFree').value,typeFree:$('#typeFree').value,raceFree:$('#raceFree').value,clockRun:null}}let savePause=false;function autoSave(full=true){if(savePause)return;save(store.draft,draftObj())}document.querySelectorAll('input,select,textarea').forEach(e=>e.addEventListener('input',autoSave));
function apply(o){if(!o)return;savePause=true;editingId=o.id&&load(store.matches,[]).some(r=>r.id===o.id)?o.id:null;$('#date').value=o.date||new Date().toISOString().slice(0,10);$('#shop').value=o.shop||'';$('#opponent').value=o.opponent||'';$('#leftName').value=o.leftName||'自分';$('#rightName').value=o.rightName||'相手';left=o.left||0;right=o.right||0;matchSec=o.matchSec||0;timeVisible=o.timeVisible!==false;$('#matchTime').style.display=timeVisible?'block':'none';$('#toggleTime').textContent=timeVisible?'非表示':'表示';$('#leftClockSelect').value=(o.clockLeftStart?o.clockLeftStart/60:10);$('#rightClockSelect').value=(o.clockRightStart?o.clockRightStart/60:10);clockLeft=o.clockLeft??Number($('#leftClockSelect').value)*60;clockRight=o.clockRight??Number($('#rightClockSelect').value)*60;$('#layoutSelect').value=o.layoutId||'';$('#memo').value=o.memo||'';['game','type','race'].forEach(k=>{const sel=$('#'+k),free=$('#'+k+'Free');if(o[k+'Sel'])sel.value=o[k+'Sel'];else if([...sel.options].some(opt=>opt.value===o[k]))sel.value=o[k];else{sel.value='自由入力';free.value=o[k]||''}free.style.display=sel.value==='自由入力'?'block':'none'});recording=o.recording!==false;$('#recordOn').classList.toggle('active',recording);$('#recordOff').classList.toggle('active',!recording);savePause=false;updateScore();updateClock()}apply(load(store.draft,null)||{date:new Date().toISOString().slice(0,10),leftName:'自分',rightName:'相手'});
$('#recordOn').onclick=()=>{recording=true;$('#recordOn').classList.add('active');$('#recordOff').classList.remove('active');autoSave()};$('#recordOff').onclick=()=>{recording=false;$('#recordOff').classList.add('active');$('#recordOn').classList.remove('active');autoSave()};$('#resetAll').onclick=()=>{if(!confirm('入力中の内容をリセットしますか？'))return;localStorage.removeItem(store.draft);location.reload()};
function renderRecords(){const rows=load(store.matches,[]);$('#recordsBody').innerHTML=rows.length?rows.map(r=>`<tr><td>${r.date||''}</td><td>${r.shop||''}</td><td>${r.leftName||'左'}</td><td>${r.rightName||'右'}</td><td>${pad(r.left)}-${pad(r.right)}</td><td><span class="badge ${r.result==='勝ち'?'win':'lose'}">${r.result}</span></td><td>${fmtSec(r.matchSec||0)}</td><td>左 ${fmtMinSec(r.clockLeft||0)} / 右 ${fmtMinSec(r.clockRight||0)}<br><small>開始 左${fmtMinSec(r.clockLeftStart||0)} 右${fmtMinSec(r.clockRightStart||0)}</small></td><td>${r.game||''}<br>${r.type||''}<br>${r.race||''}</td><td>${r.layoutTitle||'配置図なし'}<br><small>${(r.memo||'').replace(/</g,'&lt;')}</small></td><td><div class="row-actions"><button onclick="editRecord(${r.id})">編集</button><button class="danger" onclick="delRecord(${r.id})">削除</button></div></td></tr>`).join(''):`<tr><td colspan="11">記録はまだありません。</td></tr>`}renderRecords();window.editRecord=id=>{const r=load(store.matches,[]).find(x=>x.id===id);if(!r)return;apply(r);editingId=id;scrollTo({top:0,behavior:'smooth'});toast('編集画面に読み込みました')};window.delRecord=id=>{if(!confirm('この記録を削除しますか？'))return;save(store.matches,load(store.matches,[]).filter(x=>x.id!==id));renderRecords()};$('#saveMatch').onclick=()=>{if(!recording){toast('記録しない設定です');return}const r=formObj(),arr=load(store.matches,[]);const i=arr.findIndex(x=>x.id===editingId);if(i>=0){arr[i]=r}else arr.unshift(r);save(store.matches,arr);editingId=null;save(store.draft,draftObj());refreshShop();renderRecords();toast('保存しました')};
function openLayouts(){refreshLayouts();const arr=layouts();$('#layoutList').innerHTML=arr.length?arr.map(x=>`<div class="layout-item"><b>${x.title||'名称なし'}</b><small>${x.date||''}</small><br><button class="btn" onclick="chooseLayout('${x.id}')">この配置を選ぶ</button> <button class="btn" onclick="showLayoutImage('${x.id}')">画像で見る</button></div>`).join(''):'<p>保存した配置はまだありません。</p>';$('#layoutModal').classList.add('open')}window.chooseLayout=id=>{$('#layoutSelect').value=id;$('#layoutModal').classList.remove('open');autoSave();toast('配置図を選びました')};$('#layoutListBtn').onclick=openLayouts;$('#closeLayout').onclick=()=>$('#layoutModal').classList.remove('open');$('#layoutImageBtn').onclick=()=>{if(!$('#layoutSelect').value){toast('配置図を選んでください');return}showLayoutImage($('#layoutSelect').value)};$('#closeImage').onclick=()=>$('#imageModal').classList.remove('open');
const colors=['#f3d400','#1767c8','#e6382e','#6b3ba9','#ef7d15','#248046','#7b201d','#111','#f0d63b','#1767c8','#e6382e','#6b3ba9','#ef7d15','#248046','#7b201d'];function ballKind(n){const s=String(n);return s==='cue'||s.startsWith('cue-')?'cue':s==='ghost'||s.startsWith('ghost-')?'ghost':s}function ballColor(n){const k=ballKind(n);return k==='cue'?'#fff':k==='ghost'?'#dce7e3':colors[Number(k)-1]||'#fff'}function roundRect(c,x,y,w,h,r){c.beginPath();c.roundRect(x,y,w,h,r)}function drawBall(c,n,x,y,r){const k=ballKind(n);c.save();c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.clip();let g=c.createRadialGradient(x-r*.35,y-r*.35,2,x,y,r*1.2);if(k==='cue'){g.addColorStop(0,'#fff');g.addColorStop(1,'#c9c0a2')}else if(k==='ghost'){g.addColorStop(0,'rgba(255,255,255,.9)');g.addColorStop(1,'rgba(210,230,222,.45)')}else{g.addColorStop(0,'#fff');g.addColorStop(.18,ballColor(k));g.addColorStop(1,'#111')}c.fillStyle=g;c.fillRect(x-r,y-r,r*2,r*2);c.restore();if(!['cue','ghost'].includes(k)){c.fillStyle='#fff';c.font='bold 12px system-ui';c.textAlign='center';c.textBaseline='middle';c.fillText(k,x,y)}}function drawLine(c,l,cx,cy,cw,ch){const x1=cx+cw*l.x1/100,y1=cy+ch*l.y1/100,x2=cx+cw*l.x2/100,y2=cy+ch*l.y2/100;c.strokeStyle=l.color||'#fff';c.lineWidth=l.width||3;c.lineCap='round';c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();if(l.type!=='plain'){const a=Math.atan2(y2-y1,x2-x1);c.fillStyle=l.color||'#fff';c.beginPath();c.moveTo(x2,y2);c.lineTo(x2-Math.cos(a-.45)*16,y2-Math.sin(a-.45)*16);c.lineTo(x2-Math.cos(a+.45)*16,y2-Math.sin(a+.45)*16);c.closePath();c.fill()}}function showLayoutImage(id){const item=layouts().find(x=>String(x.id)===String(id));if(!item){toast('配置図がありません');return}$('#imageTitle').textContent=item.title||'名称なし';const cv=document.createElement('canvas'),c=cv.getContext('2d'),portrait=(item.orientation||'portrait')==='portrait',fw=portrait?360:660,fh=portrait?660:360,extra=72;cv.width=(fw+extra)*2;cv.height=fh*2;c.scale(2,2);c.fillStyle='#151b20';roundRect(c,0,0,fw+extra,fh,18);c.fill();c.fillStyle='#8d4b27';roundRect(c,28,18,fw-56,fh-36,10);c.fill();c.fillStyle='#0bb27e';roundRect(c,48,38,fw-96,fh-76,3);c.fill();c.strokeStyle='rgba(255,255,255,.35)';c.setLineDash([5,5]);const cw=fw-96,ch=fh-76,cx=48,cy=38;for(let i=1;i<(portrait?4:8);i++){c.beginPath();c.moveTo(cx+cw*i/(portrait?4:8),cy);c.lineTo(cx+cw*i/(portrait?4:8),cy+ch);c.stroke()}for(let i=1;i<(portrait?8:4);i++){c.beginPath();c.moveTo(cx,cy+ch*i/(portrait?8:4));c.lineTo(cx+cw,cy+ch*i/(portrait?8:4));c.stroke()}c.setLineDash([]);(item.lines||[]).forEach(l=>drawLine(c,l,cx,cy,cw,ch));Object.entries(item.state||{}).forEach(([n,p])=>drawBall(c,n,cx+cw*p.x/100,cy+ch*p.y/100,12));(item.notes||[]).forEach(n=>{c.fillStyle=n.background||'rgba(0,0,0,.75)';c.fillRect(cx+cw*n.x/100,cy+ch*n.y/100,120,28);c.fillStyle=n.color||'#ffe15b';c.font='14px sans-serif';c.fillText(n.text||'',cx+cw*n.x/100+6,cy+ch*n.y/100+18)});c.fillStyle='#020202';for(const [x,y] of [[30,20],[fw/2,20],[fw-30,20],[30,fh-20],[fw/2,fh-20],[fw-30,fh-20]]){c.beginPath();c.arc(x,y,15,0,Math.PI*2);c.fill()}c.fillStyle='#fff';c.font='bold 15px sans-serif';c.fillText('撞点',fw+36,42);drawBall(c,'cue',fw+36,80,24);if(item.tip){c.fillStyle='#e6382e';c.beginPath();c.arc(fw+12+item.tip.x*48,56+item.tip.y*48,4,0,Math.PI*2);c.fill()}$('#imagePreview').innerHTML='';$('#imagePreview').append(cv);$('#imageModal').classList.add('open')}
</script>
