<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#050706" />
  <title>対戦記録｜ビリヤード配置図メーカー</title>
  <style>
    :root{
      --green:#07543d;--green2:#0b6b4f;--deep:#050706;--cream:#f7f5ee;--card:#fff;--line:#e7e2d7;--muted:#718078;--win:#d9f5e7;--lose:#ffe0e0;--ink:#17251f;--shadow:0 16px 38px rgba(0,0,0,.26)
    }
    *{box-sizing:border-box}
    body{margin:0;min-height:100dvh;background:#050706;color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans JP","Yu Gothic",sans-serif}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 20% 0%,rgba(10,107,79,.45),transparent 30rem),radial-gradient(circle at 95% 20%,rgba(255,255,255,.08),transparent 22rem),linear-gradient(135deg,#030504,#07110d 48%,#020302);z-index:-1}
    button,input,select,textarea{font:inherit}button{cursor:pointer}.app{width:min(1280px,calc(100% - 24px));margin:auto;padding:18px 0 28px}.top{display:flex;gap:12px;align-items:center;justify-content:space-between;color:#fff;margin-bottom:14px}.top h1{font-size:clamp(23px,3vw,36px);line-height:1.2;margin:0}.top p{margin:5px 0 0;color:rgba(255,255,255,.7);font-size:13px}.top-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.top a,.top button{border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.09);color:#fff;text-decoration:none;border-radius:999px;padding:10px 14px;font-weight:850}.match-main{display:grid;grid-template-columns:1.08fr .92fr;gap:16px;align-items:start}.panel{background:var(--cream);border-radius:28px;box-shadow:var(--shadow);overflow:hidden;border:1px solid rgba(255,255,255,.22)}.panel-head{background:linear-gradient(135deg,var(--green),var(--green2));color:#fff;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}.panel-head h2{margin:0;font-size:21px}.panel-head span{display:block;margin-top:4px;color:rgba(255,255,255,.72);font-size:12px}.content{padding:14px}.score-panel{min-height:calc(100dvh - 124px);display:flex;flex-direction:column}.score-stage{flex:1;display:grid;place-items:center;padding:12px}.score-card{width:100%;border-radius:34px;background:radial-gradient(circle at 50% 100%,rgba(255,255,255,.15),transparent 36%),linear-gradient(145deg,#063426,#0a6b4d);color:#fff;padding:clamp(22px,4vw,42px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),0 16px 30px rgba(0,0,0,.24)}.score-labels,.score-row{display:grid;grid-template-columns:1fr minmax(42px,70px) 1fr;align-items:center;text-align:center}.player{font-size:clamp(15px,2vw,22px);font-weight:950;color:rgba(255,255,255,.9)}.score-row{margin-top:8px}.num{font-size:clamp(88px,16vw,190px);line-height:.92;font-weight:1000;letter-spacing:-.07em;font-variant-numeric:tabular-nums}.dash{font-size:clamp(54px,8vw,96px);font-weight:1000;color:rgba(255,255,255,.7)}.count-buttons{display:flex;justify-content:center;gap:12px;margin-top:22px}.round{width:clamp(58px,7vw,82px);height:clamp(58px,7vw,82px);border:0;border-radius:50%;background:linear-gradient(135deg,#16a56e,#0b6b4f);color:white;font-size:clamp(20px,3vw,30px);font-weight:1000;box-shadow:0 9px 16px rgba(0,0,0,.24)}.round.minus{background:#66706c}.record-toggle{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.record-toggle button{border:0;border-radius:999px;background:rgba(255,255,255,.18);color:#fff;padding:9px 12px;font-weight:900}.record-toggle button.active{background:#fff;color:var(--green)}.sub-info{padding:0 14px 14px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.mini-field{background:#fff;border:1px solid var(--line);border-radius:16px;padding:11px 12px}.label{display:block;color:var(--muted);font-size:11px;font-weight:850;margin-bottom:5px}.mini-field b{display:block;color:#12382b;font-size:15px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:0 4px 12px rgba(18,36,28,.06)}input,select,textarea{width:100%;border:0;outline:0;background:transparent;color:var(--ink);font-weight:760}textarea{min-height:92px;resize:vertical;line-height:1.6;font-weight:500}.hidden{display:none!important}.full{grid-column:1/-1}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.btn{border:1px solid var(--line);border-radius:16px;background:#fff;color:#0a513d;padding:13px 10px;font-weight:900}.btn.primary{width:100%;margin-top:12px;background:linear-gradient(135deg,var(--green),var(--green2));color:#fff;border:0;padding:16px;box-shadow:0 10px 18px rgba(8,84,61,.25)}.layout-link-card{margin-top:12px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px}.linked{margin-top:8px;font-size:13px;color:#356252}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px}.summary .card{text-align:center;padding:12px 8px}.summary b{font-size:28px;color:var(--green)}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;font-weight:900;color:#315247}.chip.active{background:var(--green);color:white}.list{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}.row{display:grid;grid-template-columns:84px 1fr 56px 58px 54px 44px;gap:8px;align-items:center;padding:11px 12px;border-bottom:1px solid #ece7dd;font-size:13px}.row:last-child{border-bottom:0}.head{color:var(--muted);font-weight:900;background:#fbfaf7}.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-weight:900;text-align:center}.win{background:var(--win);color:#087040}.lose{background:var(--lose);color:#c93a3a}.empty{padding:24px;text-align:center;color:var(--muted)}.row button{border:0;background:transparent;color:#0b6b4f;font-weight:900}.danger{color:#c93a3a!important}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(18px);background:#111;color:#fff;border-radius:999px;padding:12px 18px;opacity:0;transition:.22s;z-index:20}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.modal{position:fixed;inset:0;display:none;place-items:center;background:rgba(0,0,0,.62);z-index:15;padding:18px}.modal.open{display:grid}.modal-box{width:min(760px,100%);max-height:88dvh;overflow:auto;background:#f7f5ee;border-radius:26px;padding:16px;box-shadow:var(--shadow)}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.modal-head h3{margin:0}.close{border:0;border-radius:50%;width:40px;height:40px;background:#fff;color:#0a513d;font-weight:950}.layout-list{display:grid;gap:10px;margin-top:12px}.layout-item{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.layout-item b{display:block;color:#113a2d;margin-bottom:4px}.layout-item span{font-size:12px;color:var(--muted);line-height:1.5}.layout-item button{border:0;border-radius:999px;background:var(--green);color:#fff;padding:9px 12px;font-weight:900}.detail-box{display:grid;gap:10px;margin-top:12px}.detail-line{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 12px}.detail-line span{display:block;color:var(--muted);font-size:11px;font-weight:850;margin-bottom:4px}.detail-line b{white-space:pre-wrap}@media (orientation:portrait),(max-width:820px){.app{width:min(520px,calc(100% - 16px));padding-top:12px}.top{display:block}.top-actions{justify-content:flex-start;margin-top:12px}.match-main{grid-template-columns:1fr}.score-panel{min-height:auto}.score-stage{padding:10px}.score-card{padding:24px 12px;border-radius:28px}.num{font-size:clamp(86px,28vw,132px)}.dash{font-size:clamp(46px,12vw,62px)}.sub-info{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.row{grid-template-columns:76px 1fr 46px 48px 46px 34px;font-size:12px;padding-inline:8px}.top p{font-size:12px}.panel-head{display:block}.record-toggle{margin-top:10px}}
  </style>
</head>
<body>
  <main class="app">
    <div class="top">
      <div>
        <h1>対戦記録</h1>
        <p>点数は真ん中に大きく表示。必要な試合だけ記録して、保存済み配置図とも紐づけます。</p>
      </div>
      <div class="top-actions">
        <a href="index.html">← 配置図へ戻る</a>
        <button id="clearRecords" type="button">記録リセット</button>
      </div>
    </div>

    <div class="match-main">
      <section class="panel score-panel">
        <div class="panel-head">
          <div><h2>スコアをつける</h2><span>カウントだけでも使用できます</span></div>
          <div class="record-toggle" aria-label="記録するかどうか">
            <button id="recordOn" class="active" type="button">記録する</button>
            <button id="recordOff" type="button">記録しない</button>
          </div>
        </div>
        <div class="score-stage">
          <div class="score-card">
            <div class="score-labels"><div class="player">自分</div><div></div><div class="player">相手</div></div>
            <div class="score-row"><div id="myScore" class="num">00</div><div class="dash">-</div><div id="oppScore" class="num">00</div></div>
            <div class="score-labels">
              <div class="count-buttons"><button class="round" data-side="me" data-delta="1">+1</button><button class="round minus" data-side="me" data-delta="-1">-1</button></div>
              <div></div>
              <div class="count-buttons"><button class="round" data-side="op" data-delta="1">+1</button><button class="round minus" data-side="op" data-delta="-1">-1</button></div>
            </div>
          </div>
        </div>
        <div class="sub-info">
          <div class="mini-field"><span class="label">現在の設定</span><b id="currentMeta">未入力</b></div>
          <div class="mini-field"><span class="label">紐づけ配置</span><b id="currentLayoutName">未選択</b></div>
        </div>
      </section>

      <section class="panel" id="recordPanel">
        <div class="panel-head"><div><h2>記録内容</h2><span>保存する内容だけ下で入力</span></div></div>
        <div class="content">
          <div class="form-grid">
            <label class="field"><span class="label">日付</span><input id="date" type="date"></label>
            <label class="field"><span class="label">店舗名</span><input id="shop" list="shopList" placeholder="快活百合ヶ丘"><datalist id="shopList"></datalist></label>
            <label class="field"><span class="label">相手</span><input id="opponent" placeholder="Aさん"></label>
            <label class="field"><span class="label">種目</span><select id="game"><option>9ボール</option><option>10ボール</option><option>エイトボール</option><option>ローテーション</option><option value="custom">自由入力</option></select><input id="gameCustom" class="hidden" placeholder="種目を入力"></label>
            <label class="field"><span class="label">形式</span><select id="type"><option>平場</option><option>セットマッチ</option><option>大会</option><option>練習</option><option value="custom">自由入力</option></select><input id="typeCustom" class="hidden" placeholder="形式を入力"></label>
            <label class="field"><span class="label">先取</span><select id="race"><option value="3">3先</option><option value="4">4先</option><option value="5">5先</option><option value="7">7先</option><option value="custom">自由</option></select><input id="raceCustom" class="hidden" placeholder="例：10点制 / 時間制 / 3ラックだけ"></label>
            <label class="field full"><span class="label">メモ</span><textarea id="memo" placeholder="例：9番前の出しが薄くなった。次は厚めに残す。"></textarea></label>
          </div>
          <div class="layout-link-card">
            <label><span class="label">この試合に紐づける配置図</span><select id="layoutSelect"></select></label>
            <div class="actions"><button class="btn" id="openLayoutModal" type="button">保存した配置図を見る</button><button class="btn" id="resetScore" type="button">スコアだけ戻す</button></div>
            <div id="linkedText" class="linked">🔗 配置図を選ぶと、この試合での配置として保存されます</div>
          </div>
          <button class="btn primary" id="saveMatch" type="button">✓ 試合終了して保存</button>
        </div>
      </section>

      <section class="panel full-list" style="grid-column:1/-1">
        <div class="panel-head"><div><h2>対戦記録一覧</h2><span>保存した配置と同じように、あとから開いて確認</span></div></div>
        <div class="content">
          <div class="summary"><div class="card"><span class="label">対戦数</span><b id="totalCount">0</b></div><div class="card"><span class="label">勝ち</span><b id="winCount">0</b></div><div class="card"><span class="label">勝率</span><b id="winRate">0%</b></div></div>
          <div class="filters"><button class="chip active" data-filter="all">すべて</button><button class="chip" data-filter="win">勝ち</button><button class="chip" data-filter="lose">負け</button><button class="chip" data-filter="layout">配置あり</button></div>
          <div class="list"><div class="row head"><span>日付</span><span>店名</span><span>相手</span><span>スコア</span><span>結果</span><span>詳細</span></div><div id="scoreRows"></div></div>
        </div>
      </section>
    </div>
  </main>

  <div id="layoutModal" class="modal" role="dialog" aria-modal="true"><div class="modal-box"><div class="modal-head"><h3>保存した配置図</h3><button class="close" id="closeLayoutModal">×</button></div><div id="layoutList" class="layout-list"></div></div></div>
  <div id="detailModal" class="modal" role="dialog" aria-modal="true"><div class="modal-box"><div class="modal-head"><h3>対戦記録の詳細</h3><button class="close" id="closeDetailModal">×</button></div><div id="detailBody" class="detail-box"></div></div></div>
  <div id="toast" class="toast">保存しました</div>

<script>
const STORAGE_MATCHES='poolMatchRecords';
const STORAGE_LAYOUTS='poolNotes';
const shopSeeds=['快活百合ヶ丘','BAGUS新宿','セスパ','ジーク','NORA','パラダイスたまプラーザ','Pool & Chill','ロサ'];
const $=s=>document.querySelector(s);
let my=0,op=0,filter='all',recordEnabled=true;
function pad(n){return String(n).padStart(2,'0')}
function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function loadMatches(){return JSON.parse(localStorage.getItem(STORAGE_MATCHES)||'[]')}
function saveMatches(items){localStorage.setItem(STORAGE_MATCHES,JSON.stringify(items))}
function loadLayouts(){return JSON.parse(localStorage.getItem(STORAGE_LAYOUTS)||'[]')}
function formatDate(v){if(!v)return'';return String(v).replaceAll('-','/')}
function getGame(){return $('#game').value==='custom'?$('#gameCustom').value.trim()||'自由入力':$('#game').value}
function getType(){return $('#type').value==='custom'?$('#typeCustom').value.trim()||'自由入力':$('#type').value}
function getRace(){return $('#race').value==='custom'?$('#raceCustom').value.trim()||'自由':$('#race').selectedOptions[0].textContent}
function selectedLayout(){const id=$('#layoutSelect').value;return loadLayouts().find(l=>String(l.id)===String(id))||null}
function result(){return my>op?'勝ち':op>my?'負け':'引き分け'}
function updateScore(){ $('#myScore').textContent=pad(my); $('#oppScore').textContent=pad(op); updateMeta() }
function updateMeta(){const shop=$('#shop').value.trim()||'店舗未入力';const opp=$('#opponent').value.trim()||'相手未入力';$('#currentMeta').textContent=`${formatDate($('#date').value)}｜${shop}｜${opp}｜${getGame()}｜${getType()}｜${getRace()}`;const layout=selectedLayout();$('#currentLayoutName').textContent=layout?layout.title||'名称なし':'未選択'}
function toast(text){const t=$('#toast');t.textContent=text;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1700)}
document.querySelectorAll('[data-side]').forEach(btn=>btn.onclick=()=>{const d=Number(btn.dataset.delta);if(btn.dataset.side==='me')my=Math.max(0,my+d);else op=Math.max(0,op+d);updateScore()});
$('#resetScore').onclick=()=>{my=0;op=0;updateScore()};
$('#recordOn').onclick=()=>setRecord(true);$('#recordOff').onclick=()=>setRecord(false);
function setRecord(v){recordEnabled=v;$('#recordOn').classList.toggle('active',v);$('#recordOff').classList.toggle('active',!v);$('#recordPanel').style.display=v?'block':'none';toast(v?'この試合を記録します':'カウントだけにします')}
['date','shop','opponent','gameCustom','typeCustom','raceCustom'].forEach(id=>$('#'+id).addEventListener('input',updateMeta));
['game','type','race','layoutSelect'].forEach(id=>$('#'+id).addEventListener('change',()=>{toggleCustoms();updateMeta()}));
function toggleCustoms(){ $('#gameCustom').classList.toggle('hidden',$('#game').value!=='custom'); $('#typeCustom').classList.toggle('hidden',$('#type').value!=='custom'); $('#raceCustom').classList.toggle('hidden',$('#race').value!=='custom') }
function renderShops(){const past=[...new Set(loadMatches().map(m=>m.shop).filter(Boolean))];const all=[...new Set([...past,...shopSeeds])];$('#shopList').innerHTML=all.map(s=>`<option value="${s.replaceAll('"','&quot;')}"></option>`).join('')}
function renderLayouts(){const layouts=loadLayouts().sort((a,b)=>(Date.parse(b.updatedAt||b.createdAt||0)||0)-(Date.parse(a.updatedAt||a.createdAt||0)||0));$('#layoutSelect').innerHTML='<option value="">配置図なし</option>'+layouts.map(l=>`<option value="${l.id}">${(l.title||'名称なし').replaceAll('<','&lt;')}｜${formatDate(l.date||'')}</option>`).join('');renderLayoutList();updateMeta()}
function renderLayoutList(){const layouts=loadLayouts().sort((a,b)=>(Date.parse(b.updatedAt||b.createdAt||0)||0)-(Date.parse(a.updatedAt||a.createdAt||0)||0));const box=$('#layoutList');if(!layouts.length){box.innerHTML='<div class="empty">保存した配置図はまだありません。配置図メーカーで保存するとここに出ます。</div>';return}box.innerHTML=layouts.map(l=>`<div class="layout-item"><div><b>${escapeHtml(l.title||'名称なし')}</b><span>保存日：${escapeHtml(formatDate(l.date||l.createdAt||''))}<br>結果：${escapeHtml(l.result||'未入力')}</span></div><button data-layout="${l.id}">選ぶ</button></div>`).join('');box.querySelectorAll('[data-layout]').forEach(b=>b.onclick=()=>{$('#layoutSelect').value=b.dataset.layout;$('#layoutModal').classList.remove('open');updateMeta();toast('配置図を紐づけました')})}
function escapeHtml(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
$('#openLayoutModal').onclick=()=>{renderLayoutList();$('#layoutModal').classList.add('open')};$('#closeLayoutModal').onclick=()=>$('#layoutModal').classList.remove('open');$('#layoutModal').addEventListener('click',e=>{if(e.target.id==='layoutModal')$('#layoutModal').classList.remove('open')});
$('#closeDetailModal').onclick=()=>$('#detailModal').classList.remove('open');$('#detailModal').addEventListener('click',e=>{if(e.target.id==='detailModal')$('#detailModal').classList.remove('open')});
$('#saveMatch').onclick=()=>{if(!recordEnabled){toast('記録しない設定です');return}const layout=selectedLayout();const item={id:Date.now(),date:$('#date').value,shop:$('#shop').value.trim(),opponent:$('#opponent').value.trim(),game:getGame(),type:getType(),race:getRace(),my,op,result:result(),memo:$('#memo').value.trim(),layoutId:layout?.id||'',layoutTitle:layout?.title||'',createdAt:new Date().toISOString()};const items=loadMatches();items.unshift(item);saveMatches(items.slice(0,100));renderShops();renderRows();toast('対戦記録に保存しました')};
function renderRows(){const items=loadMatches();const shown=items.filter(m=>filter==='all'||(filter==='win'&&m.result==='勝ち')||(filter==='lose'&&m.result==='負け')||(filter==='layout'&&m.layoutId));const total=items.length,wins=items.filter(m=>m.result==='勝ち').length;$('#totalCount').textContent=total;$('#winCount').textContent=wins;$('#winRate').textContent=total?Math.round(wins/total*100)+'%':'0%';const box=$('#scoreRows');if(!shown.length){box.innerHTML='<div class="empty">記録はまだありません。</div>';return}box.innerHTML=shown.map(m=>`<div class="row"><span>${escapeHtml(formatDate(m.date))}</span><span>${escapeHtml(m.shop||'未入力')}${m.layoutId?' 🔗':''}</span><span>${escapeHtml(m.opponent||'')}</span><span>${m.my}-${m.op}</span><span class="badge ${m.result==='勝ち'?'win':'lose'}">${escapeHtml(m.result)}</span><button data-detail="${m.id}">開く</button></div>`).join('');box.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>openDetail(b.dataset.detail))}
function openDetail(id){const m=loadMatches().find(x=>String(x.id)===String(id));if(!m)return;$('#detailBody').innerHTML=`<div class="detail-line"><span>日付・店舗・相手</span><b>${escapeHtml(formatDate(m.date))}｜${escapeHtml(m.shop||'未入力')}｜${escapeHtml(m.opponent||'未入力')}</b></div><div class="detail-line"><span>種目・形式・先取</span><b>${escapeHtml(m.game)}｜${escapeHtml(m.type)}｜${escapeHtml(m.race)}</b></div><div class="detail-line"><span>スコア</span><b>${m.my} - ${m.op}　${escapeHtml(m.result)}</b></div><div class="detail-line"><span>紐づけ配置</span><b>${escapeHtml(m.layoutTitle||'なし')}</b></div><div class="detail-line"><span>メモ</span><b>${escapeHtml(m.memo||'なし')}</b></div><button class="btn danger" onclick="deleteRecord('${m.id}')">この記録を削除</button>`;$('#detailModal').classList.add('open')}
function deleteRecord(id){if(!confirm('この対戦記録を削除しますか？'))return;saveMatches(loadMatches().filter(m=>String(m.id)!==String(id)));$('#detailModal').classList.remove('open');renderRows();renderShops();toast('削除しました')}
window.deleteRecord=deleteRecord;
document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));renderRows()});
$('#clearRecords').onclick=()=>{if(confirm('対戦記録だけ削除します。配置図は消しません。')){saveMatches([]);renderRows();renderShops();toast('対戦記録をリセットしました')}};
$('#date').value=today();toggleCustoms();renderShops();renderLayouts();renderRows();updateScore();
</script>
</body>
</html>
