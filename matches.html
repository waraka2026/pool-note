<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#050706" />
  <title>対戦記録｜ビリヤード配置図メーカー</title>
  <style>
    :root{--green:#07543d;--green2:#0b6b4f;--deep:#050706;--felt:#0b5a42;--cream:#f7f5ee;--card:#fff;--line:#e7e2d7;--muted:#718078;--win:#d9f5e7;--lose:#ffe0e0;--ink:#17251f;--shadow:0 16px 38px rgba(0,0,0,.34)}
    *{box-sizing:border-box}
    body{margin:0;min-height:100dvh;color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans JP","Yu Gothic",sans-serif;background:#050706}
    button,input,select,textarea{font:inherit}button{cursor:pointer}.app{width:min(1220px,calc(100% - 22px));margin:auto;padding:16px 0 30px}.top{display:flex;gap:12px;align-items:center;justify-content:space-between;color:#fff;margin-bottom:12px}.top h1{font-size:clamp(22px,3.2vw,34px);line-height:1.2;margin:0}.top p{margin:4px 0 0;color:rgba(255,255,255,.68);font-size:12px}.top-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.top a,.top button{border:1px solid rgba(255,255,255,.26);background:rgba(255,255,255,.08);color:#fff;text-decoration:none;border-radius:999px;padding:10px 14px;font-weight:800}.record-shell{display:grid;grid-template-columns:minmax(620px,1.15fr) minmax(320px,.85fr);gap:16px;align-items:start}.panel{background:var(--cream);border-radius:28px;box-shadow:var(--shadow);overflow:hidden;border:1px solid rgba(255,255,255,.2)}.panel-head{background:linear-gradient(135deg,var(--green),var(--green2));color:#fff;padding:16px 20px;display:flex;justify-content:space-between;gap:10px;align-items:center}.panel-head h2{margin:0;font-size:21px}.panel-head span{display:block;margin-top:3px;color:rgba(255,255,255,.72);font-size:12px}.record-switch{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:6px 8px 6px 11px;font-size:12px;font-weight:800;white-space:nowrap}.record-switch button{border:0;border-radius:999px;padding:8px 10px;background:#fff;color:var(--green);font-weight:900}.record-switch button.off{background:rgba(0,0,0,.24);color:#fff}.content{padding:14px}.wide-form{display:grid;grid-template-columns:1.02fr .98fr;gap:12px;align-items:start}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:0 4px 12px rgba(18,36,28,.06)}.full{grid-column:1/-1}.label{display:block;color:var(--muted);font-size:11px;font-weight:800;margin-bottom:5px}input,select,textarea{width:100%;border:0;outline:0;background:transparent;color:var(--ink);font-weight:750}input[type="date"]{min-height:24px}textarea{min-height:88px;resize:vertical;line-height:1.6;font-weight:500}.free-field{display:none;margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}.free-field.show{display:block}.score{padding:22px 12px;border-radius:22px;background:radial-gradient(circle at 50% 100%,rgba(255,255,255,.14),transparent 30%),linear-gradient(145deg,#064331,#0a6b4d);color:#fff}.score-row{display:grid;grid-template-columns:1fr 40px 1fr;align-items:center;text-align:center}.player{font-weight:900;color:rgba(255,255,255,.9);margin-bottom:8px}.num{font-size:76px;line-height:1;font-weight:950;letter-spacing:-.05em}.dash{font-size:42px;font-weight:950;color:rgba(255,255,255,.72)}.count-buttons{display:flex;justify-content:center;gap:10px;margin-top:14px}.round{width:54px;height:54px;border:0;border-radius:50%;background:linear-gradient(135deg,#16a56e,#0b6b4f);color:white;font-size:20px;font-weight:950;box-shadow:0 8px 14px rgba(0,0,0,.2)}.round.minus{background:#66706c}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.btn{border:1px solid var(--line);border-radius:16px;background:#fff;color:#0a513d;padding:13px 10px;font-weight:900}.btn.primary{width:100%;margin-top:12px;background:linear-gradient(135deg,var(--green),var(--green2));color:#fff;border:0;padding:16px;box-shadow:0 10px 18px rgba(8,84,61,.25)}.btn:disabled{opacity:.48;cursor:not-allowed}.layout-card{margin-top:12px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px}.layout-tools{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}.table-preview{margin-top:10px;height:166px;border-radius:20px;background:linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px) 0 0/55px 55px,linear-gradient(180deg,rgba(255,255,255,.08) 1px,transparent 1px) 0 0/55px 55px,#0b684a;border:9px solid #5a331d;position:relative;overflow:hidden}.pocket{position:absolute;width:24px;height:24px;background:#111;border-radius:50%}.p1{left:-10px;top:-10px}.p2{right:-10px;top:-10px}.p3{left:-10px;bottom:-10px}.p4{right:-10px;bottom:-10px}.p5{left:50%;top:-12px}.p6{left:50%;bottom:-12px}.ball{position:absolute;width:24px;height:24px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:11px;font-weight:900;box-shadow:inset -5px -5px 9px rgba(0,0,0,.2),0 3px 8px rgba(0,0,0,.25);transform:translate(-50%,-50%)}.arrow{position:absolute;height:4px;background:white;border-radius:4px;transform-origin:left center}.arrow:after{content:"";position:absolute;right:-1px;top:-6px;border-left:13px solid white;border-top:8px solid transparent;border-bottom:8px solid transparent}.linked{display:flex;gap:8px;align-items:center;margin-top:9px;font-size:13px;color:#356252}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px}.summary .card{text-align:center;padding:12px 8px}.summary b{font-size:28px;color:var(--green)}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;font-weight:900;color:#315247}.chip.active{background:var(--green);color:white}.list{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}.row{display:grid;grid-template-columns:86px 1fr 58px 62px 56px 44px;gap:8px;align-items:center;padding:11px 12px;border-bottom:1px solid #ece7dd;font-size:13px}.row:last-child{border-bottom:0}.head{color:var(--muted);font-weight:900;background:#fbfaf7}.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-weight:900;text-align:center}.win{background:var(--win);color:#087040}.lose{background:var(--lose);color:#c93a3a}.empty{padding:24px;text-align:center;color:var(--muted)}.row button{border:0;background:transparent;color:#0b6b4f;font-weight:900}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(18px);background:#111;color:#fff;border-radius:999px;padding:12px 18px;opacity:0;transition:.22s;z-index:20}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.modal{position:fixed;inset:0;display:none;place-items:center;background:rgba(0,0,0,.58);z-index:15;padding:18px}.modal.open{display:grid}.modal-box{width:min(760px,100%);max-height:88dvh;overflow:auto;background:#f7f5ee;border-radius:26px;padding:16px;box-shadow:var(--shadow)}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.modal-head h3{margin:0}.close{border:0;border-radius:50%;width:40px;height:40px;background:#fff;color:#0a513d;font-weight:950}.layout-list{display:grid;gap:10px;margin-top:12px}.mini-layout{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;grid-template-columns:104px 1fr;gap:12px;align-items:center}.mini-table{height:66px;border-radius:10px;background:#0b684a;border:5px solid #5a331d;position:relative;overflow:hidden}.mini-ball{position:absolute;width:10px;height:10px;background:white;border-radius:50%;transform:translate(-50%,-50%)}.mini-layout b{display:block;color:#113a2d;margin-bottom:3px}.mini-layout span{font-size:12px;color:var(--muted);line-height:1.5}.mini-layout button{margin-top:7px;border:0;border-radius:999px;background:var(--green);color:#fff;padding:7px 10px;font-weight:900}.record-detail{display:none;background:#fff;border:1px solid var(--line);border-radius:18px;margin-top:10px;padding:12px;white-space:pre-wrap;font-size:13px;line-height:1.7}.record-detail.show{display:block}.danger{color:#c93a3a!important}@media (max-width:920px){.app{width:min(500px,calc(100% - 16px))}.top{display:block}.top-actions{justify-content:flex-start;margin-top:12px}.record-shell,.wide-form{grid-template-columns:1fr}.panel-head{display:block}.record-switch{margin-top:10px;width:max-content}.row{grid-template-columns:76px 1fr 48px 54px 50px 34px;font-size:12px;padding-inline:8px}.num{font-size:68px}.grid{gap:8px}.field{padding:10px}.layout-tools{grid-template-columns:1fr}.table-preview{height:148px}}
  </style>
</head>
<body>
  <main class="app">
    <div class="top">
      <div>
        <h1>対戦記録</h1>
        <p>カウントしたスコアを、配置図とメモつきで保存できます。</p>
      </div>
      <div class="top-actions">
        <a href="index.html">← 配置図へ戻る</a>
        <button id="clearRecords" type="button">記録リセット</button>
      </div>
    </div>

    <section class="panel">
      <div class="panel-head">
        <div><h2>スコアをつける</h2><span>横長では入力とカウントを並べて表示。スマホ縦向きでは縦に並びます。</span></div>
        <div class="record-switch"><span>この試合を記録しますか？</span><button id="recordToggle" type="button">記録する</button></div>
      </div>
      <div class="content wide-form">
        <div>
          <div class="grid">
            <label class="field"><span class="label">日付</span><input id="date" type="date"></label>
            <label class="field"><span class="label">店舗名</span><input id="shop" list="shopHistory" placeholder="店舗名を入力" autocomplete="off"><datalist id="shopHistory"></datalist></label>
            <label class="field"><span class="label">相手</span><input id="opponent" placeholder="Aさん / 名前なしでもOK"></label>
            <label class="field"><span class="label">種目</span><select id="game"><option>9ボール</option><option>10ボール</option><option>エイトボール</option><option>ローテーション</option><option value="free">自由入力</option></select><input id="gameFree" class="free-field" placeholder="種目を自由入力"></label>
            <label class="field"><span class="label">形式</span><select id="type"><option>平場</option><option>相撞き</option><option>セットマッチ</option><option>大会</option><option>練習</option><option value="free">自由入力</option></select><input id="typeFree" class="free-field" placeholder="形式を自由入力"></label>
            <label class="field"><span class="label">先取</span><select id="race"><option value="3">3先</option><option value="4">4先</option><option value="5">5先</option><option value="7">7先</option><option value="free">自由</option></select><input id="raceFree" class="free-field" placeholder="例：10点制 / 30分 / 何先でもない"></label>
          </div>
          <label class="field full" style="margin-top:10px"><span class="label">メモ</span><textarea id="memo" placeholder="例：9番前の出しが薄くなった。次は厚めに残す。"></textarea></label>
        </div>

        <div>
          <div class="score">
            <div class="score-row">
              <div><div class="player">自分</div><div id="myScore" class="num">0</div><div class="count-buttons"><button class="round" data-side="me" data-delta="1">+1</button><button class="round minus" data-side="me" data-delta="-1">-1</button></div></div>
              <div class="dash">-</div>
              <div><div class="player">相手</div><div id="oppScore" class="num">0</div><div class="count-buttons"><button class="round" data-side="op" data-delta="1">+1</button><button class="round minus" data-side="op" data-delta="-1">-1</button></div></div>
            </div>
          </div>
          <div class="layout-card">
            <div class="layout-tools">
              <label><span class="label">この試合に紐づける配置図</span><select id="layoutSelect"></select></label>
              <button class="btn" id="layoutListBtn" type="button">配置図を見る</button>
            </div>
            <div id="layoutPreview" class="table-preview" aria-label="配置図プレビュー"></div>
            <div id="linkedText" class="linked">🔗 配置図を選ぶと、この試合の配置として保存されます</div>
          </div>
          <div class="actions"><button class="btn" id="resetScore" type="button">スコアだけ戻す</button><button class="btn primary" id="saveMatch" type="button">✓ 試合終了して保存</button></div>
        </div>
      </div>
    </section>

    <section class="panel" style="margin-top:16px">
      <div class="panel-head"><div><h2>対戦記録一覧表</h2><span>保存した配置と同じように、記録を一覧で見返せます。</span></div></div>
      <div class="content">
        <div class="summary"><div class="card"><span class="label">対戦数</span><b id="totalCount">0</b></div><div class="card"><span class="label">勝ち</span><b id="winCount">0</b></div><div class="card"><span class="label">勝率</span><b id="winRate">0%</b></div></div>
        <div class="filters"><button class="chip active" data-filter="all">すべて</button><button class="chip" data-filter="win">勝ち</button><button class="chip" data-filter="lose">負け</button><button class="chip" data-filter="layout">配置あり</button></div>
        <div class="list"><div class="row head"><span>日付</span><span>店舗名</span><span>相手</span><span>スコア</span><span>結果</span><span>詳細</span></div><div id="scoreRows"></div></div>
      </div>
    </section>
  </main>

  <div id="layoutModal" class="modal" role="dialog" aria-modal="true">
    <div class="modal-box"><div class="modal-head"><h3>保存した配置図</h3><button class="close" id="closeModal">×</button></div><div id="layoutList" class="layout-list"></div></div>
  </div>
  <div id="toast" class="toast">保存しました</div>

<script>
const STORAGE_MATCHES='poolMatchRecords';
const STORAGE_LAYOUTS='poolNotes';
const BALL_COLORS=['#f3d400','#1767c8','#e6382e','#6b3ba9','#ef7d15','#248046','#7b201d','#111','#f0d63b','#1767c8','#e6382e','#6b3ba9','#ef7d15','#248046','#7b201d'];
let my=0,op=0,filter='all',recordEnabled=true;
const $=id=>document.getElementById(id);
const today=new Date();$('date').value=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
function readMatches(){return JSON.parse(localStorage.getItem(STORAGE_MATCHES)||'[]')}
function writeMatches(v){localStorage.setItem(STORAGE_MATCHES,JSON.stringify(v))}
function readLayouts(){return JSON.parse(localStorage.getItem(STORAGE_LAYOUTS)||'[]')}
function showToast(text){const t=$('toast');t.textContent=text;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1700)}
function getFree(selectId,inputId){const sel=$(selectId),inp=$(inputId);return sel.value==='free'?(inp.value.trim()||'自由入力'):sel.options[sel.selectedIndex].text}
function toggleFree(selectId,inputId){const show=$(selectId).value==='free';$(inputId).classList.toggle('show',show);if(show)$(inputId).focus()}
['game','type','race'].forEach(id=>$(id).addEventListener('change',()=>toggleFree(id,id+'Free')));
function updateScore(){ $('myScore').textContent=my; $('oppScore').textContent=op; }
document.querySelectorAll('[data-side]').forEach(btn=>btn.onclick=()=>{const d=Number(btn.dataset.delta); if(btn.dataset.side==='me') my=Math.max(0,my+d); else op=Math.max(0,op+d); updateScore();});
$('resetScore').onclick=()=>{my=0;op=0;updateScore();showToast('スコアを戻しました')};
$('recordToggle').onclick=()=>{recordEnabled=!recordEnabled;$('recordToggle').textContent=recordEnabled?'記録する':'記録しない';$('recordToggle').classList.toggle('off',!recordEnabled);$('saveMatch').disabled=!recordEnabled;showToast(recordEnabled?'この試合を記録します':'この試合は記録しません')};
function refreshShopHistory(){const set=new Set(readMatches().map(m=>m.shop).filter(Boolean));['快活百合ヶ丘','BAGUS新宿','セスパ','パラダイスたまプラーザ','ジーク','NORA'].forEach(s=>set.add(s));$('shopHistory').innerHTML=[...set].map(s=>`<option value="${escapeHtml(s)}"></option>`).join('')}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function layoutTitle(l){return l?.title||l?.name||'名称なし'}
function layoutDate(l){const d=l?.updatedAt||l?.createdAt||l?.date||'';if(!d)return'';const t=new Date(d);return Number.isNaN(t.getTime())?String(d):t.toLocaleDateString('ja-JP')}
function renderPockets(el){['p1','p2','p3','p4','p5','p6'].forEach(c=>{const p=document.createElement('i');p.className='pocket '+c;el.appendChild(p)})}
function renderLayoutPreview(target,item,mini=false){target.innerHTML='';renderPockets(target);if(!item){target.innerHTML='<div style="display:grid;place-items:center;height:100%;color:rgba(255,255,255,.82);font-weight:800;text-align:center;padding:12px">保存済み配置図がありません</div>';return}const st=item.state||{};Object.entries(st).slice(0,18).forEach(([n,p])=>{const b=document.createElement('span');b.className=mini?'mini-ball':'ball';if(n!=='cue'&&!String(n).startsWith('cue')){const num=parseInt(String(n).replace(/\D/g,''),10);b.style.background=BALL_COLORS[(num||1)-1]||'#fff';if(num&&!mini)b.textContent=String(num>15?'':num)}b.style.left=(p.x||50)+'%';b.style.top=(p.y||50)+'%';target.appendChild(b)});(item.lines||[]).slice(0,10).forEach(l=>{const a=document.createElement('span');a.className='arrow';const x1=l.x1||0,y1=l.y1||0,x2=l.x2||0,y2=l.y2||0;const dx=x2-x1,dy=y2-y1;const len=Math.hypot(dx,dy);a.style.left=x1+'%';a.style.top=y1+'%';a.style.width=len+'%';a.style.transform=`rotate(${Math.atan2(dy,dx)}rad)`;target.appendChild(a)})}
function refreshLayouts(){const layouts=readLayouts();const select=$('layoutSelect');select.innerHTML='<option value="">配置図なし</option>'+layouts.map(l=>`<option value="${l.id}">${escapeHtml(layoutTitle(l))} ${layoutDate(l)?'｜'+layoutDate(l):''}</option>`).join('');const chosen=new URLSearchParams(location.search).get('layoutId');if(chosen&&layouts.some(l=>String(l.id)===String(chosen)))select.value=chosen;updateLayoutPreview();}
function selectedLayout(){const id=$('layoutSelect').value;return readLayouts().find(l=>String(l.id)===String(id))||null}
function updateLayoutPreview(){const item=selectedLayout();renderLayoutPreview($('layoutPreview'),item);$('linkedText').textContent=item?`🔗 「${layoutTitle(item)}」をこの試合に紐づけ中`:'🔗 配置図を選ぶと、この試合の配置として保存されます'}
$('layoutSelect').addEventListener('change',updateLayoutPreview);
function openLayoutModal(){const list=$('layoutList'),layouts=readLayouts();list.innerHTML='';if(!layouts.length){list.innerHTML='<p class="empty">保存した配置図はまだありません。先に配置図メーカーで保存してください。</p>'; } layouts.forEach(item=>{const card=document.createElement('div');card.className='mini-layout';const table=document.createElement('div');table.className='mini-table';renderLayoutPreview(table,item,true);const meta=document.createElement('div');meta.innerHTML=`<b>${escapeHtml(layoutTitle(item))}</b><span>${escapeHtml(layoutDate(item)||'日時不明')}</span><br><button type="button">この配置を選ぶ</button>`;meta.querySelector('button').onclick=()=>{ $('layoutSelect').value=item.id; updateLayoutPreview(); closeLayoutModal(); showToast('配置図を紐づけました')};card.append(table,meta);list.append(card)});$('layoutModal').classList.add('open')}
function closeLayoutModal(){$('layoutModal').classList.remove('open')}
$('layoutListBtn').onclick=openLayoutModal;$('closeModal').onclick=closeLayoutModal;$('layoutModal').addEventListener('click',e=>{if(e.target.id==='layoutModal')closeLayoutModal()});
function saveMatch(){if(!recordEnabled){showToast('記録しない設定です');return}const layout=selectedLayout();const match={id:Date.now(),date:$('date').value,shop:$('shop').value.trim()||'店舗未入力',opponent:$('opponent').value.trim()||'相手未入力',game:getFree('game','gameFree'),type:getFree('type','typeFree'),race:getFree('race','raceFree'),my,op,result:my>=op?'勝ち':'負け',memo:$('memo').value.trim(),layoutId:layout?.id||'',layoutTitle:layout?layoutTitle(layout):'',createdAt:new Date().toISOString()};const matches=readMatches();matches.unshift(match);writeMatches(matches.slice(0,100));refreshShopHistory();renderMatches();showToast('対戦記録一覧に保存しました')}
$('saveMatch').onclick=saveMatch;
function renderMatches(){const rows=$('scoreRows');let matches=readMatches();const total=matches.length,wins=matches.filter(m=>m.result==='勝ち').length;$('totalCount').textContent=total;$('winCount').textContent=wins;$('winRate').textContent=total?Math.round(wins/total*100)+'%':'0%';if(filter==='win')matches=matches.filter(m=>m.result==='勝ち');if(filter==='lose')matches=matches.filter(m=>m.result==='負け');if(filter==='layout')matches=matches.filter(m=>m.layoutId);if(!matches.length){rows.innerHTML='<p class="empty">まだ表示する対戦記録がありません。</p>';return}rows.innerHTML=matches.map(m=>`<div class="row"><span>${escapeHtml(m.date||'')}</span><span>${escapeHtml(m.shop)}</span><span>${escapeHtml(m.opponent)}</span><span>${m.my}-${m.op}</span><span class="badge ${m.result==='勝ち'?'win':'lose'}">${m.result}</span><button type="button" data-id="${m.id}">開く</button></div><div class="record-detail" id="detail-${m.id}">種目：${escapeHtml(m.game)}\n形式：${escapeHtml(m.type)}\n先取：${escapeHtml(m.race)}\n配置図：${escapeHtml(m.layoutTitle||'なし')}\nメモ：${escapeHtml(m.memo||'なし')}\n${m.layoutId?`\n<a href="index.html?layoutId=${encodeURIComponent(m.layoutId)}">配置図メーカーで開く</a>`:''}</div>`).join('');rows.querySelectorAll('button[data-id]').forEach(b=>b.onclick=()=>{$('detail-'+b.dataset.id)?.classList.toggle('show')})}
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));c.classList.add('active');filter=c.dataset.filter;renderMatches()});
$('clearRecords').onclick=()=>{if(confirm('対戦記録をすべて削除しますか？配置図データは消しません。')){writeMatches([]);renderMatches();refreshShopHistory();showToast('対戦記録をリセットしました')}};
refreshShopHistory();refreshLayouts();renderMatches();updateScore();
</script>
</body>
</html>
