<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#ffffff">
<title>ビリヤード配置図メーカー</title>
<style>
:root{--g:#0ba577;--g2:#07845f;--ink:#183d34;--line:#dce9e3;--soft:#f4faf7;--wood:#8a4d26}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Yu Gothic",sans-serif;background:#f4faf7;color:var(--ink)}
button,input{font:inherit}button{cursor:pointer}.header{height:66px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;z-index:30}
.brand{display:flex;align-items:center;gap:9px}.bird{width:42px;height:42px;border:1px solid var(--line);border-radius:12px;background:#fff;display:grid;place-items:center;font-size:26px}.brand small{display:block;color:var(--g);font-size:9px;font-weight:900;letter-spacing:.12em}.brand b{font-size:17px}.head-actions{display:flex;gap:7px}.head-actions button{border:1px solid var(--line);background:#fff;border-radius:11px;padding:8px 10px;font-weight:800;color:#31564c}
.app{max-width:1440px;margin:auto;padding:12px;display:grid;grid-template-columns:210px minmax(480px,1fr) 270px;gap:12px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 28px rgba(28,82,66,.08)}
.left,.right{padding:11px;align-self:start}.orientation{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:9px}.orientation button,.btn{border:1px solid var(--line);background:#fff;border-radius:11px;min-height:44px;font-weight:900;color:#31564c}.orientation button.active,.btn.active{background:var(--g);color:#fff;border-color:var(--g)}
.tools{display:grid;gap:6px}.tool{border:1px solid var(--line);background:#fff;border-radius:11px;min-height:46px;padding:8px;text-align:left;font-weight:800;color:#31564c}.tool.active{background:var(--g);color:#fff;border-color:var(--g)}.tool.danger{color:#a44740}
.center{overflow:hidden}.centerbar{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--line)}.status{font-size:11px;color:#698278}.centerbar .actions{display:flex;gap:6px}.centerbar button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 9px;font-weight:800}.stage{min-height:690px;display:grid;place-items:center;padding:20px 30px 52px;position:relative;background:radial-gradient(circle at 30% 20%,rgba(11,165,119,.08),transparent 34%),linear-gradient(#fcfffd,#f4fbf8)}
.table-wrap{position:relative;transform-origin:center}.table{width:360px;height:610px;padding:18px;border-radius:24px;background:linear-gradient(90deg,#70401f,#b96f38 18%,#87451f 45%,#c27b43 70%,#70401f);box-shadow:0 20px 36px rgba(40,57,50,.22);position:relative;transition:.2s}.table.landscape{width:650px;height:380px}.cloth{position:relative;width:100%;height:100%;background:#08a978;border:8px solid #126a52;border-radius:12px;overflow:hidden;touch-action:none;background-image:linear-gradient(rgba(255,255,255,.22) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.22) 1px,transparent 1px);background-size:25% 14.285%}
.pocket{position:absolute;width:28px;height:28px;border-radius:50%;background:#090b0b;z-index:5}.p1{left:4px;top:4px}.p2{right:4px;top:4px}.p3{left:4px;top:50%;transform:translateY(-50%)}.p4{right:4px;top:50%;transform:translateY(-50%)}.p5{left:4px;bottom:4px}.p6{right:4px;bottom:4px}.table.landscape .p3{left:50%;top:4px;transform:translateX(-50%)}.table.landscape .p4{left:50%;right:auto;top:auto;bottom:4px;transform:translateX(-50%)}
.ball{position:absolute;width:34px;height:34px;border-radius:50%;transform:translate(-50%,-50%);display:grid;place-items:center;border:2px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.25);font-size:10px;font-weight:900;z-index:10;touch-action:none;user-select:none}.ball span{width:15px;height:15px;border-radius:50%;background:#fff;display:grid;place-items:center}.ball.cue{background:#fff}.ball.ghost{background:rgba(255,70,70,.12)!important;border:2px dotted #e14545;box-shadow:none}.ball.ghost span{display:none}
#svg{position:absolute;inset:0;width:100%;height:100%;z-index:8;pointer-events:none}.line-hit{pointer-events:stroke}.note{position:absolute;transform:translate(-50%,-50%);background:#fff7cf;border:1px solid #efd87b;border-radius:9px;padding:6px 8px;font-size:11px;font-weight:800;z-index:12;touch-action:none}
.guide{position:absolute;inset:0;pointer-events:none;z-index:9}.guide:before,.guide:after{content:"";position:absolute;background:rgba(255,255,255,.65)}.guide:before{left:var(--x);top:0;width:1px;height:100%}.guide:after{top:var(--y);left:0;height:1px;width:100%}
.right h3{font-size:13px;color:#0b7557;margin:4px 0 8px}.balls{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.pick{aspect-ratio:1;border:1px solid var(--line);background:#fff;border-radius:10px;display:grid;place-items:center;touch-action:none}.mini{width:34px;height:34px;border-radius:50%;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.18);display:grid;place-items:center;font-size:9px;font-weight:900}.mini span{width:14px;height:14px;background:#fff;border-radius:50%;display:grid;place-items:center}.mini.cue{background:#fff;border-color:#d6ddd9}.mini.ghost{background:rgba(255,70,70,.12);border:2px dotted #e14545;box-shadow:none}.section{padding:8px 0 12px}.section+.section{border-top:1px solid var(--line)}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11px;margin:8px 0}.line-types{display:grid;grid-template-columns:1fr 1fr;gap:6px}.line-types button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px;font-weight:800}.line-types button.active{background:var(--g);color:#fff}.swatches{display:flex;gap:7px;flex-wrap:wrap}.swatch{width:28px;height:28px;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 1px #ccd9d3}
.mobile-dock,.sheet{display:none}.sheet-head{display:flex;align-items:center;justify-content:space-between}.sheet-head button{border:0;background:#edf5f1;border-radius:9px;width:34px;height:34px;font-size:20px}.sheet-panel{display:none}.sheet-panel.active{display:block}
@media(max-width:760px){.head-actions{display:none}.brand b{font-size:15px}.app{display:block;padding:8px 8px 74px}.left,.right{display:none}.center{border-radius:16px}.centerbar{padding:8px}.centerbar .actions{display:none}.stage{min-height:0;padding:12px 2px 40px}.table{width:min(88vw,330px);height:min(158vw,595px)}.table.landscape{width:min(96vw,560px);height:min(56vw,326px)}.mobile-orient{display:flex!important;gap:5px}.mobile-orient button{border:1px solid var(--line);background:#fff;border-radius:9px;min-width:42px;min-height:36px;font-weight:900}.mobile-dock{display:grid;position:fixed;left:8px;right:8px;bottom:8px;z-index:80;grid-template-columns:repeat(5,1fr);gap:4px;padding:6px;background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:17px;box-shadow:0 10px 28px rgba(20,60,49,.22)}.mobile-dock button{border:0;background:transparent;border-radius:10px;height:50px;color:#31564c;font-size:10px;font-weight:900}.mobile-dock button span{display:block;font-size:19px}.mobile-dock button.active{background:var(--g);color:#fff}.sheet{display:block;position:fixed;left:0;right:0;bottom:0;z-index:100;background:#fff;border-radius:20px 20px 0 0;box-shadow:0 -15px 36px rgba(25,60,50,.25);transform:translateY(105%);transition:.2s;max-height:68vh;overflow:hidden}.sheet.open{transform:translateY(0)}.sheet-head{padding:10px 13px;border-bottom:1px solid var(--line)}.sheet-body{padding:10px 13px 18px;overflow:auto;max-height:calc(68vh - 54px)}.sheet .balls{grid-template-columns:repeat(5,1fr)}.sheet .pick{min-height:54px}.more{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.more button{min-height:58px;border:1px solid var(--line);background:#fff;border-radius:11px;font-weight:800;color:#31564c}.rightlike{display:grid;gap:8px}.mobile-note{font-size:10px;color:#71877f;margin:8px 0 0}}
@media(min-width:761px){.mobile-orient{display:none!important}}
dialog{border:0;border-radius:16px;max-width:min(520px,90vw);padding:0;box-shadow:0 20px 50px rgba(0,0,0,.25)}dialog::backdrop{background:rgba(0,0,0,.35)}.dialogin{padding:18px}.dialogin h2{margin-top:0}.dialogin button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 10px;font-weight:800}
</style>
</head>
<body>
<header class="header"><div class="brand"><div class="bird">🐦</div><div><small>BILLIARDS LAYOUT MAKER</small><b>ビリヤード配置図メーカー</b></div></div><div class="head-actions"><button id="helpTop">? 使い方</button><button id="saveTop">💾 保存</button></div></header>
<main class="app">
<aside class="panel left"><div class="orientation"><button id="pBtn" class="active">縦向き</button><button id="lBtn">横向き</button></div><div class="tools">
<button class="tool active" data-mode="move">➤ 移動</button><button class="tool" data-mode="group">▣ 全部まとめて移動</button><button class="tool" id="undoBtn">↶ 戻る</button><button class="tool" id="redoBtn">↷ 進む</button><button class="tool" data-mode="arrow">↗ 矢印</button><button class="tool" data-mode="line">╱ 線</button><button class="tool" data-mode="erase">◇ 線を消す</button><button class="tool" data-mode="memo">✎ メモを追加</button><button class="tool" id="zin">⊕ 拡大</button><button class="tool" id="zout">⊖ 縮小</button><button class="tool danger" id="reset">× リセット</button></div></aside>
<section class="panel center"><div class="centerbar"><div><b>配置編集</b><div class="status" id="status">縦向き・移動</div></div><div class="mobile-orient"><button id="mp">縦</button><button id="ml">横</button></div><div class="actions"><button id="help">使い方</button><button id="save">配置を保存</button></div></div>
<div class="stage"><div class="table-wrap" id="wrap"><div class="table" id="table"><b class="pocket p1"></b><b class="pocket p2"></b><b class="pocket p3"></b><b class="pocket p4"></b><b class="pocket p5"></b><b class="pocket p6"></b><div class="cloth" id="cloth"><div class="guide" id="guide" hidden></div><svg id="svg"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><polygon points="0 0,8 3.5,0 7" fill="context-stroke"></polygon></marker></defs></svg></div></div></div></div></section>
<aside class="panel right"><div class="section"><h3>🎱 ボール</h3><div class="balls" id="balls"></div></div><div class="section"><h3>╱ 線・矢印</h3><div class="line-types"><button id="arrowType" class="active">↗ 矢印</button><button id="lineType">╱ 線</button></div><div class="row"><span>カラー</span><input id="color" type="color" value="#ffffff"></div><div class="swatches" id="swatches"></div><div class="row"><span>太さ</span><input id="width" type="range" min="1" max="8" value="3"></div></div><div class="section"><h3>⚙ 表示</h3><div class="row"><span>グリッド</span><input id="grid" type="checkbox" checked></div></div></aside>
</main>
<nav class="mobile-dock" id="dock"><button data-sheet="balls"><span>🎱</span>球</button><button data-sheet="arrow"><span>↗</span>矢印</button><button data-sheet="line"><span>╱</span>線</button><button data-sheet="tip"><span>◎</span>撞点</button><button data-sheet="more"><span>☰</span>その他</button></nav>
<section class="sheet" id="sheet"><div class="sheet-head"><b id="sheetTitle">球</b><button id="sheetClose">×</button></div><div class="sheet-body"><div class="sheet-panel active" data-panel="balls"><div class="balls" id="mballs"></div><p class="mobile-note">球を台へドラッグして配置できます。</p></div><div class="sheet-panel" data-panel="arrow"><div class="rightlike"><button class="btn active" id="mArrow">↗ 矢印モード</button><label class="row">色 <input id="mColor" type="color" value="#ffffff"></label><label class="row">太さ <input id="mWidth" type="range" min="1" max="8" value="3"></label></div></div><div class="sheet-panel" data-panel="line"><div class="rightlike"><button class="btn active" id="mLine">╱ 線モード</button><label class="row">色 <input id="mColor2" type="color" value="#ffffff"></label><label class="row">太さ <input id="mWidth2" type="range" min="1" max="8" value="3"></label></div></div><div class="sheet-panel" data-panel="tip"><p>撞点は次の調整で専用図を追加予定。今は手玉メモとして利用できます。</p></div><div class="sheet-panel" data-panel="more"><div class="more"><button id="mUndo">↶<br>戻る</button><button id="mRedo">↷<br>進む</button><button id="mGroup">▣<br>全部まとめて移動</button><button id="mMemo">✎<br>メモ</button><button id="mZin">⊕<br>拡大</button><button id="mZout">⊖<br>縮小</button><button id="mSave">💾<br>保存</button><button id="mHelp">?<br>使い方</button><button id="mReset">×<br>リセット</button></div></div></div></section>
<dialog id="helpDlg"><div class="dialogin"><h2>使い方</h2><p>球は一覧から台へドラッグ。矢印・線はモードを選び、台の上をドラッグします。球は長押しまたは右クリックで削除できます。</p><button id="helpClose">閉じる</button></div></dialog>
<script>
(()=>{const C={1:"#f2cf32",2:"#267dce",3:"#df4540",4:"#8b58ae",5:"#eb862d",6:"#2f9563",7:"#8a3e36",8:"#222",9:"#f2cf32",10:"#267dce",11:"#df4540",12:"#8b58ae",13:"#eb862d",14:"#2f9563",15:"#8a3e36"};
const S={ori:"p",mode:"move",type:"arrow",color:"#fff",width:3,zoom:1,balls:[],lines:[],notes:[],next:1};let undo=[],redo=[],action=null;
const q=s=>document.querySelector(s),qa=s=>[...document.querySelectorAll(s)],cloth=q("#cloth"),table=q("#table"),svg=q("#svg"),guide=q("#guide");
const snap=()=>{undo.push(JSON.stringify(S));if(undo.length>30)undo.shift();redo=[]};const restore=x=>{Object.assign(S,JSON.parse(x));render()};
function setOri(o){S.ori=o;table.classList.toggle("landscape",o==="l");q("#pBtn").classList.toggle("active",o==="p");q("#lBtn").classList.toggle("active",o==="l");status.textContent=(o==="p"?"縦向き":"横向き")+"・"+S.mode}
function setMode(m){S.mode=m;qa(".tool[data-mode]").forEach(b=>b.classList.toggle("active",b.dataset.mode===m));status.textContent=(S.ori==="p"?"縦向き":"横向き")+"・"+m}
function bg(n){if(n===0)return"#fff";const c=C[n];return n<9?c:`linear-gradient(${c} 0 28%,#fff 28% 72%,${c} 72%)`}
function renderBalls(){cloth.querySelectorAll(".ball,.note").forEach(e=>e.remove());S.balls.forEach(b=>{const e=document.createElement("div");e.className="ball"+(b.kind==="cue"?" cue":"")+(b.kind==="ghost"?" ghost":"");e.style.left=b.x*100+"%";e.style.top=b.y*100+"%";if(b.kind==="num"){e.style.background=bg(b.n);const s=document.createElement("span");s.textContent=b.n;e.appendChild(s)}let sx,sy,bx,by,moved=false,timer;e.onpointerdown=ev=>{if(S.mode==="erase")return;ev.preventDefault();e.setPointerCapture(ev.pointerId);snap();sx=ev.clientX;sy=ev.clientY;bx=b.x;by=b.y;timer=setTimeout(()=>{if(!moved){S.balls=S.balls.filter(x=>x.id!==b.id);render()}},650);action="ball"};e.onpointermove=ev=>{if(action!=="ball")return;moved=true;clearTimeout(timer);const r=cloth.getBoundingClientRect();b.x=Math.max(.03,Math.min(.97,bx+(ev.clientX-sx)/r.width));b.y=Math.max(.03,Math.min(.97,by+(ev.clientY-sy)/r.height));e.style.left=b.x*100+"%";e.style.top=b.y*100+"%"};e.onpointerup=()=>{clearTimeout(timer);action=null};e.oncontextmenu=ev=>{ev.preventDefault();snap();S.balls=S.balls.filter(x=>x.id!==b.id);render()};cloth.appendChild(e)});S.notes.forEach(n=>{const e=document.createElement("div");e.className="note";e.textContent=n.t;e.style.left=n.x*100+"%";e.style.top=n.y*100+"%";cloth.appendChild(e)})}
function renderLines(){svg.querySelectorAll("line.user").forEach(e=>e.remove());S.lines.forEach((l,i)=>{const e=document.createElementNS("http://www.w3.org/2000/svg","line");e.classList.add("user","line-hit");e.setAttribute("x1",l.x1*100+"%");e.setAttribute("y1",l.y1*100+"%");e.setAttribute("x2",l.x2*100+"%");e.setAttribute("y2",l.y2*100+"%");e.setAttribute("stroke",l.c);e.setAttribute("stroke-width",l.w);if(l.t==="arrow")e.setAttribute("marker-end","url(#arr)");e.style.pointerEvents="stroke";e.onclick=()=>{if(S.mode==="erase"){snap();S.lines.splice(i,1);renderLines()}};svg.appendChild(e)})}
function render(){setOri(S.ori);q("#wrap").style.transform=`scale(${S.zoom})`;renderBalls();renderLines()}
function spawn(kind,n,x=.5,y=.5){snap();S.balls.push({id:S.next++,kind,n,x,y});renderBalls()}
function build(host){host.innerHTML="";[["cue",0],["ghost",0],...Array.from({length:15},(_,i)=>["num",i+1])].forEach(([kind,n])=>{const b=document.createElement("button");b.className="pick";const m=document.createElement("span");m.className="mini "+kind;if(kind==="num"){m.style.background=bg(n);const s=document.createElement("span");s.textContent=n;m.appendChild(s)}b.appendChild(m);let g=null;b.onpointerdown=e=>{e.preventDefault();g={id:e.pointerId,prev:null};b.setPointerCapture(e.pointerId)};b.onpointermove=e=>{if(!g)return;if(!g.prev){g.prev=m.cloneNode(true);g.prev.style.position="fixed";g.prev.style.zIndex=999;g.prev.style.pointerEvents="none";document.body.appendChild(g.prev)}g.prev.style.left=e.clientX-17+"px";g.prev.style.top=e.clientY-30+"px";const r=cloth.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-30-r.top)/r.height,inside=x>=0&&x<=1&&y>=0&&y<=1;guide.hidden=!inside;if(inside){guide.style.setProperty("--x",x*100+"%");guide.style.setProperty("--y",y*100+"%")}};b.onpointerup=e=>{const r=cloth.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-30-r.top)/r.height,inside=x>=0&&x<=1&&y>=0&&y<=1;if(g?.prev)g.prev.remove();g=null;guide.hidden=true;if(inside)spawn(kind,n,Math.max(.03,Math.min(.97,x)),Math.max(.03,Math.min(.97,y)));};b.onclick=()=>spawn(kind,n);host.appendChild(b)})}
cloth.onpointerdown=e=>{if(S.mode==="arrow"||S.mode==="line"){snap();const r=cloth.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;action={x,y};cloth.setPointerCapture(e.pointerId)}else if(S.mode==="memo"){const t=prompt("メモを入力");if(t){const r=cloth.getBoundingClientRect();snap();S.notes.push({t,x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height});renderBalls()}}};cloth.onpointerup=e=>{if(!action||!action.x)return;const r=cloth.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;S.lines.push({x1:action.x,y1:action.y,x2:x,y2:y,c:S.color,w:S.width,t:S.mode});action=null;renderLines()};
q("#pBtn").onclick=q("#mp").onclick=()=>setOri("p");q("#lBtn").onclick=q("#ml").onclick=()=>setOri("l");qa(".tool[data-mode]").forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
function doUndo(){if(!undo.length)return;redo.push(JSON.stringify(S));restore(undo.pop())}function doRedo(){if(!redo.length)return;undo.push(JSON.stringify(S));restore(redo.pop())}
q("#undoBtn").onclick=q("#mUndo").onclick=doUndo;q("#redoBtn").onclick=q("#mRedo").onclick=doRedo;
function zoom(d){S.zoom=Math.max(.7,Math.min(1.35,S.zoom+d));render()}q("#zin").onclick=q("#mZin").onclick=()=>zoom(.1);q("#zout").onclick=q("#mZout").onclick=()=>zoom(-.1);
function reset(){if(confirm("配置をリセットしますか？")){snap();S.balls=[];S.lines=[];S.notes=[];render()}}q("#reset").onclick=q("#mReset").onclick=reset;
function save(){localStorage.setItem("pool-note-layout",JSON.stringify(S));alert("保存しました")}q("#save").onclick=q("#saveTop").onclick=q("#mSave").onclick=save;
q("#grid").onchange=e=>cloth.style.backgroundImage=e.target.checked?"linear-gradient(rgba(255,255,255,.22) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.22) 1px,transparent 1px)":"none";
q("#arrowType").onclick=()=>{S.type="arrow";setMode("arrow");q("#arrowType").classList.add("active");q("#lineType").classList.remove("active")};q("#lineType").onclick=()=>{S.type="line";setMode("line");q("#lineType").classList.add("active");q("#arrowType").classList.remove("active")};
q("#color").oninput=e=>S.color=e.target.value;q("#width").oninput=e=>S.width=+e.target.value;
["#mColor","#mColor2"].forEach(s=>q(s).oninput=e=>S.color=e.target.value);["#mWidth","#mWidth2"].forEach(s=>q(s).oninput=e=>S.width=+e.target.value);q("#mArrow").onclick=()=>setMode("arrow");q("#mLine").onclick=()=>setMode("line");q("#mGroup").onclick=()=>{setMode("group");sheet.classList.remove("open")};q("#mMemo").onclick=()=>{setMode("memo");sheet.classList.remove("open")};
const colors=["#ffffff","#ffc928","#ed4943","#2583cf","#252525","#0ba577"];colors.forEach(c=>{const b=document.createElement("button");b.className="swatch";b.style.background=c;b.onclick=()=>S.color=c;q("#swatches").appendChild(b)});
const help=()=>q("#helpDlg").showModal();q("#help").onclick=q("#helpTop").onclick=q("#mHelp").onclick=help;q("#helpClose").onclick=()=>q("#helpDlg").close();
