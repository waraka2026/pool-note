<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Billiards Match Records</title>
<style>
:root{
  --green:#0ba577;--green2:#07845f;--deep:#123d35;--mint:#edf9f4;
  --line:#dbe8e2;--muted:#6b837a;--shadow:0 12px 34px rgba(24,77,62,.10)
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;color:#163a32;background:#f5faf7}
button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:inherit}
.app-header{height:88px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center}
.header-inner{width:100%;max-width:1400px;height:100%;margin:auto;padding:0 18px;display:flex;align-items:center;justify-content:space-between;gap:18px}
.header-brand{flex:0 0 auto;display:flex;align-items:center;height:72px}
.counter-logo{width:294px;height:66px;position:relative;overflow:hidden;background:#fff}
.counter-logo img{position:absolute;left:0;top:0;width:286px;height:64px;object-fit:contain;object-position:left center}
.logo-top-mask{position:absolute;left:68px;top:0;width:150px;height:18px;background:#fff;z-index:2}
.logo-word-mask{position:absolute;left:194px;top:18px;width:98px;height:46px;background:#fff;z-index:2}
.counter-logo-word{position:absolute;left:196px;top:33px;z-index:3;display:flex;align-items:center;font-size:23px;line-height:1;font-weight:1000;letter-spacing:-1px;white-space:nowrap}
.counter-logo-word i{font-style:normal}.counter-logo-word i:nth-child(1){color:#08a879}.counter-logo-word i:nth-child(2){color:#f2a71d}.counter-logo-word i:nth-child(3){color:#e9523f}.counter-logo-word i:nth-child(4){color:#3f73cf}.counter-logo-word i:nth-child(5){color:#8457b5}.counter-logo-word i:nth-child(6){color:#0ba577}.counter-logo-word i:nth-child(7){color:#f07b31}
.topnav{margin-left:auto;display:flex;justify-content:flex-end;align-items:center;gap:8px;flex-wrap:nowrap;overflow:auto}
.topnav button{border:0;background:#f5f8f6;color:#274a41;border-radius:999px;padding:11px 15px;font-weight:800;white-space:nowrap}.topnav .active{background:var(--green);color:#fff}
.wrap{max-width:1400px;margin:0 auto;padding:18px}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:14px}.page-head h1{margin:0;font-size:28px}.page-head p{margin:5px 0 0;color:var(--muted);font-size:13px}
.panel{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.entry-panel{padding:18px;margin-bottom:16px}.entry-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.entry-head h2{margin:0;font-size:20px}.entry-head span{font-size:12px;color:var(--muted)}
.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.field{background:#f8fbf9;border:1px solid var(--line);border-radius:14px;padding:10px 11px;display:block;min-width:0}.field .label{display:block;color:#6b837a;font-size:11px;font-weight:900;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;border:0;outline:0;background:transparent;color:#173e35;font-weight:800;min-width:0}.field textarea{min-height:92px;resize:vertical;line-height:1.55;font-weight:600}.free{display:none;margin-top:8px;border-top:1px solid var(--line)!important;padding-top:8px}
.wide{grid-column:span 2}.full{grid-column:1/-1}
.layout-box{background:#f8fbf9;border:1px solid var(--line);border-radius:14px;padding:11px}.layout-title{font-size:13px;font-weight:950;color:#0b7557;margin:0 0 8px}.layout-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.btn{border:1px solid var(--line);border-radius:11px;background:#fff;color:#0a513d;padding:10px 12px;font-weight:900;text-decoration:none;text-align:center}.primary{background:linear-gradient(135deg,var(--green),var(--green2));color:#fff;border:0}.entry-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}.entry-actions .primary{min-width:190px}.layout-meta{display:block;margin-top:7px;color:var(--muted);font-size:10px;font-weight:700;line-height:1.5}
.records-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}.records-head h2{margin:0;font-size:22px}.records-head span{font-size:13px;color:var(--muted)}
.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:980px}th,td{padding:14px 12px;border-bottom:1px solid #e8efeb;text-align:left;vertical-align:top;font-size:14px;line-height:1.55}th{background:#f8fbf9;color:#668078;font-size:13px;white-space:nowrap}small{font-size:12px;color:var(--muted)}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-weight:900}.win{background:#dff7ea;color:#087040}.lose{background:#ffe7e4;color:#bb3a31}.draw{background:#edf1ef;color:#4e625b}.pending{background:#fff5d8;color:#8b6b00}
.actions{display:flex;gap:6px;flex-wrap:nowrap}.actions button{border:0;border-radius:999px;background:#eef7f3;color:#07543d;padding:7px 10px;font-weight:900;white-space:nowrap}.actions .danger{background:#fff0ee;color:#b62222}
.empty{padding:34px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(18px);background:#173e35;color:#fff;border-radius:999px;padding:12px 18px;opacity:0;transition:.22s;z-index:80;white-space:nowrap;box-shadow:0 10px 28px rgba(0,0,0,.18)}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:900px){.form-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.app-header{height:auto;min-height:76px}.header-inner{padding:7px 10px;gap:8px}.counter-logo{width:222px;height:52px}.counter-logo img{width:216px;height:50px}.logo-top-mask{left:51px;width:114px;height:14px}.logo-word-mask{left:146px;top:14px;width:74px;height:36px}.counter-logo-word{left:148px;top:25px;font-size:18px}}
@media(max-width:620px){.header-inner{flex-wrap:wrap}.header-brand{height:58px}.topnav{width:100%;justify-content:flex-start}.counter-logo{width:252px;height:56px}.counter-logo img{width:246px;height:55px}.logo-top-mask{left:58px;width:130px;height:15px}.logo-word-mask{left:166px;top:15px;width:84px;height:40px}.counter-logo-word{left:168px;top:28px;font-size:20px}.wrap{padding:10px}.page-head h1{font-size:23px}.form-grid{grid-template-columns:1fr}.wide,.full{grid-column:auto}th,td{font-size:13px;padding:11px 9px}.entry-actions{flex-direction:column}.entry-actions .primary{width:100%}}
</style>
</head>
<body>
<header class="app-header">
  <div class="header-inner">
    <div class="header-brand" aria-label="Billiards 9 Counter">
      <div class="counter-logo">
        <img src="assets/brand-logo.png" alt="Billiards 9 Counter">
        <span class="logo-top-mask" aria-hidden="true"></span>
        <span class="logo-word-mask" aria-hidden="true"></span>
        <span class="counter-logo-word" aria-hidden="true"><i>C</i><i>o</i><i>u</i><i>n</i><i>t</i><i>e</i><i>r</i></span>
      </div>
    </div>
    <nav class="topnav">
      <button type="button" onclick="location.href='index.html'">⌂ 配置図</button>
      <button type="button" onclick="location.href='matches.html'">▣ カウンター</button>
      <button class="active" type="button">▣ 対戦記録</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <div class="page-head"><div><h1>Billiards Match Records</h1><p>対戦記録の新規登録・編集・一覧</p></div></div>

  <section class="panel entry-panel">
    <div class="entry-head"><h2 id="formTitle">対戦記録を新規登録</h2><span>カウンターを使わない試合もここから登録できます</span></div>
    <div class="form-grid">
      <label class="field"><span class="label">日付</span><input id="date" type="date"></label>
      <label class="field"><span class="label">店舗名</span><input id="shop" placeholder="店舗名を入力"></label>
      <label class="field"><span class="label">対戦相手</span><input id="opponent" placeholder="相手名"></label>
      <label class="field"><span class="label">対戦相手の所属店舗</span><input id="opponentShop" placeholder="所属店舗を入力"></label>
      <label class="field"><span class="label">種目</span><select id="game"><option value=""></option><option>9ボール</option><option>10ボール</option><option>エイトボール</option><option>ローテーション</option><option>自由入力</option></select><input id="gameFree" class="free" placeholder="種目を自由入力"></label>
      <label class="field"><span class="label">形式</span><select id="type"><option value=""></option><option>平場</option><option>セットマッチ</option><option>大会</option><option>練習</option><option>自由入力</option></select><input id="typeFree" class="free" placeholder="形式を自由入力"></label>
      <label class="field"><span class="label">何先</span><select id="race"><option value=""></option><option>2先</option><option>3先</option><option>4先</option><option>5先</option><option>6先</option><option>自由入力</option></select><input id="raceFree" class="free" placeholder="例：7先・点数制など"></label>
      <label class="field"><span class="label">エントリーフィー</span><input id="entryFee" inputmode="numeric" placeholder="例：3000円"></label>
      <label class="field"><span class="label">対戦結果</span><select id="matchResult"><option value=""></option><option>勝ち</option><option>負け</option><option>引き分け</option></select></label>
      <label class="field"><span class="label">自分のスコア（任意）</span><input id="leftScoreInput" type="number" min="0" inputmode="numeric" placeholder="例：5"></label>
      <label class="field"><span class="label">相手のスコア（任意）</span><input id="rightScoreInput" type="number" min="0" inputmode="numeric" placeholder="例：3"></label>
      <div class="layout-box wide">
        <p class="layout-title">この試合に紐づける配置図</p>
        <select id="layoutSelect"></select>
        <div class="layout-actions"><button id="layoutRefresh" class="btn" type="button">配置図リストを更新</button><a class="btn" href="index.html">配置図を開く</a></div>
        <small id="layoutMeta" class="layout-meta"></small>
      </div>
      <label class="field full"><span class="label">メモ</span><textarea id="memo" placeholder="試合内容や反省点など"></textarea></label>
    </div>
    <div class="entry-actions">
      <button id="cancelEdit" class="btn" type="button" hidden>編集をやめる</button>
      <button id="saveRecord" class="btn primary" type="button">✓ 新規登録</button>
    </div>
  </section>

  <section class="panel">
    <div class="records-head"><div><h2>対戦記録一覧</h2><span>データがない列は自動で非表示</span></div></div>
    <div class="table-wrap"><table><thead id="recordsHead"></thead><tbody id="recordsBody"></tbody></table></div>
  </section>
</main>
<div id="toast" class="toast"></div>

<script>
const $=s=>document.querySelector(s);
const KEY='poolMatchRecords',LAYOUTS='poolNotes';
let editingId=null;
function load(k=KEY,d=[]){try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch{return d}}
function save(v){localStorage.setItem(KEY,JSON.stringify(v))}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function norm(v){v=String(v??'').trim();return v==='自由入力'?'':v}
function pad(n){return String(Math.max(0,Math.floor(Number(n)||0))).padStart(2,'0')}
function fmtSec(s){s=Math.max(0,Math.floor(Number(s)||0));return pad(s/3600|0)+':'+pad((s%3600)/60|0)+':'+pad(s%60)}
function fmtMin(s){s=Math.max(0,Math.floor(Number(s)||0));return pad(s/60|0)+':'+pad(s%60)}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1500)}
function resultClass(r){return r==='勝ち'?'win':r==='負け'?'lose':r==='引き分け'?'draw':'pending'}
function formatSavedTime(value){if(!value)return'';const d=new Date(value);return Number.isNaN(d.getTime())?String(value):d.toLocaleString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}
function valueWithFree(id){const s=$('#'+id),f=$('#'+id+'Free');return s.value==='自由入力'?f.value.trim():s.value.trim()}
function setSelectWithFree(id,value){const s=$('#'+id),f=$('#'+id+'Free'),opts=[...s.options].map(o=>o.value);const v=norm(value);if(opts.includes(v)){s.value=v;f.value=''}else if(v){s.value='自由入力';f.value=v}else{s.value='';f.value=''}f.style.display=s.value==='自由入力'?'block':'none'}
['game','type','race'].forEach(id=>$('#'+id).addEventListener('change',()=>{$('#'+id+'Free').style.display=$('#'+id).value==='自由入力'?'block':'none'}));
function readLayouts(){const v=load(LAYOUTS,[]);return Array.isArray(v)?v.filter(Boolean):[]}
function layoutTime(x){const t=Date.parse(x?.updatedAt||x?.createdAt||x?.date||'');return Number.isNaN(t)?0:t}
function refreshLayouts(keep=true){const s=$('#layoutSelect'),cur=keep?s.value:'';const list=readLayouts().sort((a,b)=>layoutTime(b)-layoutTime(a));s.innerHTML='';s.add(new Option('配置図なし',''));list.forEach(x=>s.add(new Option((x.title||'名称なし')+(x.updatedAt||x.createdAt||x.date?'｜'+formatSavedTime(x.updatedAt||x.createdAt||x.date):''),String(x.id))));if(cur&&list.some(x=>String(x.id)===String(cur)))s.value=cur;updateLayoutMeta()}
function selectedLayout(){const id=$('#layoutSelect').value;return id?readLayouts().find(x=>String(x.id)===String(id))||null:null}
function updateLayoutMeta(){const x=selectedLayout();$('#layoutMeta').textContent=x?'選択中：'+(x.title||'名称なし'):'配置図メーカーで保存した配置を選べます。'}
$('#layoutSelect').addEventListener('change',updateLayoutMeta);$('#layoutRefresh').onclick=()=>{refreshLayouts(true);toast('配置図リストを更新しました')};
function clearForm(){
 editingId=null;$('#formTitle').textContent='対戦記録を新規登録';$('#saveRecord').textContent='✓ 新規登録';$('#cancelEdit').hidden=true;
 $('#date').value=new Date().toISOString().slice(0,10);['shop','opponent','opponentShop','entryFee','leftScoreInput','rightScoreInput','memo'].forEach(id=>$('#'+id).value='');
 ['game','type','race','matchResult'].forEach(id=>$('#'+id).value='');['gameFree','typeFree','raceFree'].forEach(id=>{$('#'+id).value='';$('#'+id).style.display='none'});refreshLayouts(false);
}
function recordFromForm(){
 const layout=selectedLayout(),l=$('#leftScoreInput').value,r=$('#rightScoreInput').value,scoreEntered=l!==''||r!=='';
 return {
  id:editingId||Date.now(),date:$('#date').value,shop:$('#shop').value.trim(),opponent:$('#opponent').value.trim(),
  opponentShop:$('#opponentShop').value.trim(),leftName:'自分',rightName:$('#opponent').value.trim()||'相手',
  game:valueWithFree('game'),gameSel:$('#game').value,gameFree:$('#gameFree').value,
  type:valueWithFree('type'),typeSel:$('#type').value,typeFree:$('#typeFree').value,
  race:valueWithFree('race'),raceSel:$('#race').value,raceFree:$('#raceFree').value,
  entryFee:$('#entryFee').value.trim(),result:$('#matchResult').value,
  left:scoreEntered?Number(l||0):null,right:scoreEntered?Number(r||0):null,scoreEntered,
  matchSec:0,clockUsed:false,layoutId:$('#layoutSelect').value,layoutTitle:layout?(layout.title||'名称なし'):'配置図なし',
  layoutUpdatedAt:layout?(layout.updatedAt||layout.createdAt||layout.date||''):'',layoutSnapshot:layout?JSON.parse(JSON.stringify(layout)):null,
  memo:$('#memo').value.trim(),createdAt:new Date().toISOString(),source:'manual'
 };
}
$('#saveRecord').onclick=()=>{
 const rec=recordFromForm(),rows=load(KEY,[]),i=rows.findIndex(x=>String(x.id)===String(editingId));
 if(i>=0){rec.createdAt=rows[i].createdAt||rec.createdAt;rows[i]=rec}else rows.unshift(rec);
 save(rows);render();toast(i>=0?'更新しました':'登録しました');clearForm();
};
$('#cancelEdit').onclick=clearForm;
function clockText(r){if(!r.clockUsed)return'';return esc(norm(r.leftName)||'自分')+' '+fmtMin(r.clockLeft??0)+' / '+esc(norm(r.rightName)||'相手')+' '+fmtMin(r.clockRight??0)}
function meta(r){return[norm(r.game),norm(r.type),norm(r.race)].filter(Boolean).map(esc).join('<br>')}
function scoreText(r){if(r.scoreEntered===false)return'';if(r.left==null&&r.right==null)return'';return pad(r.left)+'-'+pad(r.right)}
function render(){
 const rows=load(KEY,[]),head=$('#recordsHead'),body=$('#recordsBody');
 if(!rows.length){head.innerHTML='<tr><th>対戦記録</th></tr>';body.innerHTML='<tr><td class="empty">記録はまだありません。</td></tr>';return}
 const hasShop=rows.some(r=>norm(r.shop)),hasOpponentShop=rows.some(r=>norm(r.opponentShop)),hasLeft=rows.some(r=>norm(r.leftName)),hasRight=rows.some(r=>norm(r.rightName)||norm(r.opponent)),
 hasScore=rows.some(r=>scoreText(r)),hasResult=rows.some(r=>norm(r.result)),hasFee=rows.some(r=>norm(r.entryFee)),hasTime=rows.some(r=>Number(r.matchSec||0)>0),hasClock=rows.some(r=>!!r.clockUsed),
 hasMeta=rows.some(r=>[norm(r.game),norm(r.type),norm(r.race)].some(Boolean)),hasLM=rows.some(r=>(norm(r.layoutTitle)&&norm(r.layoutTitle)!=='配置図なし')||norm(r.memo));
 const cols=[
  {s:true,l:'日付',c:r=>esc(r.date)},{s:hasShop,l:'店舗',c:r=>esc(r.shop)},{s:hasLeft,l:'自分',c:r=>esc(r.leftName)},{s:hasRight,l:'相手',c:r=>esc(r.rightName||r.opponent)},
  {s:hasOpponentShop,l:'相手所属店舗',c:r=>esc(r.opponentShop)},{s:hasScore,l:'スコア',c:r=>scoreText(r)},
  {s:hasResult,l:'結果',c:r=>norm(r.result)?'<span class="badge '+resultClass(r.result)+'">'+esc(r.result)+'</span>':''},{s:hasFee,l:'エントリーフィー',c:r=>esc(r.entryFee)},
  {s:hasTime,l:'試合時間',c:r=>Number(r.matchSec||0)>0?fmtSec(r.matchSec):''},{s:hasClock,l:'チェスクロック',c:r=>clockText(r)},{s:hasMeta,l:'種目/形式/何先',c:r=>meta(r)},
  {s:hasLM,l:'配置図/メモ',c:r=>{const p=[];if(norm(r.layoutTitle)&&norm(r.layoutTitle)!=='配置図なし')p.push(esc(r.layoutTitle));if(r.layoutUpdatedAt)p.push('<small>配置更新：'+esc(formatSavedTime(r.layoutUpdatedAt))+'</small>');if(norm(r.memo))p.push('<small>'+esc(r.memo)+'</small>');return p.join('<br>')}},
  {s:true,l:'操作',c:r=>'<div class="actions"><button onclick="editRecord(\''+r.id+'\')">編集</button><button class="danger" onclick="deleteRecord(\''+r.id+'\')">削除</button></div>'}
 ].filter(x=>x.s);
 head.innerHTML='<tr>'+cols.map(x=>'<th>'+x.l+'</th>').join('')+'</tr>';
 body.innerHTML=rows.map(r=>'<tr>'+cols.map(x=>'<td>'+x.c(r)+'</td>').join('')+'</tr>').join('');
}
window.editRecord=id=>{
 const r=load(KEY,[]).find(x=>String(x.id)===String(id));if(!r)return;editingId=r.id;$('#formTitle').textContent='対戦記録を編集';$('#saveRecord').textContent='✓ 更新する';$('#cancelEdit').hidden=false;
 $('#date').value=r.date||'';$('#shop').value=r.shop||'';$('#opponent').value=r.opponent||r.rightName||'';$('#opponentShop').value=r.opponentShop||'';setSelectWithFree('game',r.game);setSelectWithFree('type',r.type);setSelectWithFree('race',r.race);
 $('#entryFee').value=r.entryFee||'';$('#matchResult').value=r.result||'';$('#leftScoreInput').value=r.left==null?'':r.left;$('#rightScoreInput').value=r.right==null?'':r.right;$('#memo').value=r.memo||'';
 refreshLayouts(false);if(r.layoutId)$('#layoutSelect').value=String(r.layoutId);updateLayoutMeta();scrollTo({top:0,behavior:'smooth'});
}
window.deleteRecord=id=>{if(!confirm('この記録を削除しますか？'))return;save(load(KEY,[]).filter(x=>String(x.id)!==String(id)));render()}
window.addEventListener('storage',render);refreshLayouts(false);clearForm();render();
</script>
</body>
</html>
